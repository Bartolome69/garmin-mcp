<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training plan</title>
<style>
  /* Older names the share image and shared helpers still use. */
  :root { --threshold: var(--hard); --threshold-text: var(--hard); --intervals: var(--hard); --swim: var(--long); --red-soft: var(--red-tint); }
  /* The plan card, redesigned (Nov 2026, handoff v2): header and goal race,
     this week's numbers, the whole block as monochrome bars, then the chosen
     week, its sessions opening in place. Colour means intensity, never
     sport; every state has an icon and a word, never colour alone. Dashed
     always means not loaded yet, never zero. */
  :root {
    color-scheme: light;
    --card: #FFFFFF; --text: #1F1E1B; --muted: #6B6A64; --faint: #73726C; --border: #E6E4DD; --subtle: #F0EEE8;
    --btn-border: #D9D7CF; --red: #E0312A; --red-text: #C8261F; --red-tint: #FDF0EE; --red-bd: #F2C9C4;
    --bar-done: #9A9993; --bar-plan: #E0DED7; --on-red: #FFFFFF;
    --easy: #3F8A47; --long: #2F68B0; --hard: #C27A12; --rec: #C9C7C0; --strength: #7E57C2; --race: #E0312A; --hard-text: #8F5A0B;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --card: #30302E; --text: #F4F3EE; --muted: #A6A59F; --faint: #9A9993; --border: #3D3D3A; --subtle: #3A3936;
      --btn-border: #4A4844; --red: #E8322B; --red-text: #FF6A61; --red-tint: rgba(232,50,43,.14); --red-bd: rgba(255,106,97,.45);
      --bar-done: #8E8C86; --bar-plan: #4A4844;
      --easy: #8CC08F; --long: #74A3DB; --hard: #E3B23F; --rec: #5A5954; --strength: #A98BE0; --race: #E8322B; --hard-text: #E3B23F;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --card: #30302E; --text: #F4F3EE; --muted: #A6A59F; --faint: #9A9993; --border: #3D3D3A; --subtle: #3A3936;
    --btn-border: #4A4844; --red: #E8322B; --red-text: #FF6A61; --red-tint: rgba(232,50,43,.14); --red-bd: rgba(255,106,97,.45);
    --bar-done: #8E8C86; --bar-plan: #4A4844;
    --easy: #8CC08F; --long: #74A3DB; --hard: #E3B23F; --rec: #5A5954; --strength: #A98BE0; --race: #E8322B; --hard-text: #E3B23F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { color: var(--text); font: 14px/1.4 Geist, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, [role=button]:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
  .card { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
  section { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
  section:last-child { border-bottom: 0; }
  .empty { padding: 28px 20px; color: var(--muted); font-size: 14px; }

  /* ---- header */
  .brand { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .wordmark { font-weight: 800; font-style: italic; letter-spacing: -0.03em; color: var(--red-text); font-size: 16px; }
  .kicker { font-size: 11px; letter-spacing: 0.14em; color: var(--muted); }
  .tools { margin-left: auto; display: flex; gap: 6px; }
  .iconbtn { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--btn-border); background: transparent;
    display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  .title { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; overflow-wrap: anywhere; }
  .sub { font-size: 13.5px; color: var(--muted); }
  .goal { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 12px; background: var(--red-tint); border: 1px solid var(--red-bd); min-height: 44px; }
  .goal-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .goal-k { font-size: 10.5px; letter-spacing: 0.1em; color: var(--red-text); }
  .goal-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .goal-date { font-size: 12.5px; color: var(--muted); }
  .count { text-align: right; color: var(--red-text); white-space: nowrap; }
  .count b { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .count span { font-size: 12.5px; margin-left: 4px; }
  .also { font-size: 12.5px; color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pills[data-fit] { flex-wrap: nowrap; overflow: hidden; }
  .pills[data-fit] .pill { flex: 0 0 auto; }
  .pills[data-fit] .pill:not(.more):only-of-type, .pills[data-fit] .pill:first-child:nth-last-child(2) { flex-shrink: 1; min-width: 0; }
  .pill { all: unset; box-sizing: border-box; cursor: pointer; height: 44px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--btn-border); display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
  .pill small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .pill.past { opacity: .55; }
  .pill.sel { outline: 2px solid var(--text); outline-offset: -2px; }
  .pill.more { border-style: dashed; color: var(--muted); font-weight: 500; }
  .nogoal { border: 1.5px dashed var(--btn-border); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
  .mk { display: inline-block; flex-shrink: 0; border-radius: 999px; }
  .mk.goal-m { width: 10px; height: 10px; background: var(--red); }
  .mk.key { width: 10px; height: 10px; border: 2px solid var(--text); }
  .mk.tune { width: 8px; height: 8px; border: 2px solid var(--muted); }
  .mk.other { width: 6px; height: 6px; background: var(--faint); }

  /* ---- this week */
  .row-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .h2 { font-size: 15.5px; font-weight: 600; }
  .note { font-size: 12.5px; color: var(--muted); }
  .prog { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; background: transparent; }
  .prog i { display: block; height: 100%; }
  .prog .p-done { background: var(--text); }
  .prog .p-extra { background: var(--easy); }
  .prog .p-go { background: var(--red-tint); box-shadow: inset 0 0 0 1.5px var(--red-bd); border-radius: 0 999px 999px 0; }
  .prog .p-unk { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); border-radius: 0 999px 999px 0; opacity: .7; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .nums b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .nums span { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }

  /* ---- block chart */
  .scroller { overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: thin; padding: 4px 4px 4px; margin: -4px -4px 0; position: relative; }
  .grid { display: grid; column-gap: 4px; }
  .marks { height: 12px; align-items: center; justify-items: center; }
  .bars { height: 100px; align-items: end; }
  .bar { all: unset; box-sizing: border-box; cursor: pointer; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; border-radius: 4px; width: 100%; max-width: 40px; justify-self: center; }
  .bar .b { display: block; border-radius: 3px 3px 0 0; min-height: 3px; }
  .bar .bk { display: block; font-size: 10px; line-height: 12px; margin-bottom: 2px; text-align: center; color: var(--muted); white-space: nowrap; overflow: visible; }
  .bar .bk.on { color: var(--text); font-weight: 600; }
  .bar .b + .b { border-radius: 0; }
  .bar .b:last-child { border-radius: 0 0 3px 3px; }
  .bar .b:only-child { border-radius: 3px; }
  .bar .done { background: var(--bar-done); }
  .bar .plan { background: var(--bar-plan); }
  .bar .now { background: var(--red); }
  .bar .rest { background: var(--red); opacity: .35; }
  .bar .unk { background: transparent; border: 1.5px dashed var(--faint); }
  .bar.sel { outline: 1.5px solid var(--text); outline-offset: 2px; }
  .nums-row { align-items: center; justify-items: center; font-size: 11px; color: var(--faint); min-height: 14px; }
  .nums-row .cur { color: var(--red-text); font-weight: 600; }
  .bands { height: 24px; }
  .band { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: center; overflow: hidden;
    border-radius: 6px; background: var(--subtle); font-size: 10.5px; letter-spacing: .06em; color: var(--muted); white-space: nowrap;
    border-bottom: 2px solid transparent; }
  .band.on { background: transparent; border-bottom-color: var(--red); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
  .band.unk { background: transparent; border: 1.5px dashed var(--faint); }
  .band.gap { background: transparent; border: 0; cursor: default; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  /* ---- selected week */
  .wk-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .wk-t { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .wk-t small { font-size: 13px; font-weight: 400; color: var(--muted); }
  .navs { display: flex; gap: 8px; }
  .navs .iconbtn:disabled { opacity: .35; cursor: default; }
  .split { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .split-bar { display: flex; height: 4px; border-radius: 4px; overflow: hidden; gap: 2px; }
  .split-bar i { display: block; height: 100%; background: var(--faint); }
  .split-items { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .split-items span { display: inline-flex; align-items: center; gap: 4px; }
  .split-items b { color: var(--text); font-weight: 600; }
  .rows { display: flex; flex-direction: column; margin: 0 -8px; }
  .srow { display: grid; grid-template-columns: 38px 22px 1fr auto 14px; align-items: center; gap: 8px; min-height: 58px;
    padding: 8px; border-top: 1px solid var(--subtle); border-radius: 10px; }
  .srow:first-child { border-top: 0; }
  .srow.tap { cursor: pointer; }
  .srow.hot { background: var(--red-tint); border-top-color: transparent; }
  .srow.hot + .srow { border-top-color: transparent; }
  .day { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .hot .day { color: var(--red-text); }
  .st { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; }
  .st.ring { border: 2px solid var(--red); }
  .st.miss { border: 2px solid var(--red); }
  .st.dashring { border: 1.5px dashed var(--faint); }
  .st.dot i { width: 8px; height: 8px; border-radius: 999px; display: block; }
  .mid { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .line1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .typ { font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .ttl { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ttl.dim { color: var(--muted); }
  .ttl.struck { text-decoration: line-through; color: var(--muted); }
  .meta { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta.red { white-space: normal; }
  .meta.red { color: var(--red-text); }
  .val { font-size: 15px; font-weight: 600; white-space: nowrap; text-align: right; }
  .val small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .val.dim { color: var(--muted); font-weight: 500; }
  .val.struck { text-decoration: line-through; color: var(--muted); font-weight: 400; }
  .chev { color: var(--faint); display: inline-flex; }
  .open .chev { transform: rotate(90deg); }
  .shape { display: flex; align-items: flex-end; gap: 2px; height: 12px; max-width: 260px; }
  .shape span { display: block; border-radius: 2px; }
  .sicon { display: inline-flex; color: var(--muted); flex-shrink: 0; }
  .collapsed { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px;
    padding: 0 8px; font-size: 13.5px; color: var(--muted); }
  .collapsed b { color: var(--text); font-weight: 600; }

  /* ---- an open session */
  .detail { padding: 4px 8px 14px 76px; display: flex; flex-direction: column; gap: 10px; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
  .facts b { color: var(--text); font-size: 16px; font-weight: 700; margin-right: 3px; }
  .chart { position: relative; display: flex; align-items: flex-end; gap: 3px; height: 110px; }
  .chart span { display: block; border-radius: 3px 3px 0 0; min-width: 3px; position: relative; }
  .chart span.rest { background: var(--rec) !important; }
  .chart span em { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-style: normal; color: var(--muted); white-space: nowrap; }
  .chart i { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--faint); }
  .chart i b { position: absolute; left: 0; top: -15px; font-size: 10.5px; font-weight: 400; color: var(--muted); }
  .dnote { font-size: 12.5px; color: var(--muted); }
  .steps { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .steps li { display: grid; grid-template-columns: 4px auto 1fr; align-items: center; gap: 10px; font-size: 13.5px; }
  .steps li i { display: block; width: 4px; height: 22px; border-radius: 4px; }
  .steps li b { font-weight: 600; }
  .steps li span { color: var(--muted); }
  .steps li.rep { padding-left: 14px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .act { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--btn-border); background: transparent; font-size: 14px; font-weight: 500; }
  .act.red { background: var(--red); border-color: var(--red); color: var(--on-red); }
  .sent { font-size: 12.5px; color: var(--muted); }

  /* ---- loading, failed, getting started */
  .skel { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  .skel i { display: block; background: var(--subtle); border-radius: 8px; }
  .skel .say { font-size: 13px; color: var(--muted); }
  @keyframes pulse { 50% { opacity: .55; } }
  .skel i { animation: pulse 1.4s ease-in-out infinite; }
  .failbox { display: flex; flex-direction: column; gap: 10px; }
  .failbox b { font-size: 16px; }
  @media (max-width: 380px) { .detail { padding-left: 8px; } .srow { grid-template-columns: 32px 20px 1fr auto 12px; gap: 6px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .diag { margin: 12px; padding: 12px 14px; border-radius: 10px; background: #FFF3CD; color: #3D2C00;
    border: 1px solid #E8C96A; font: 14px/1.45 system-ui, -apple-system, Roboto, sans-serif; }
  .diag.waiting { background: #EEF2EE; color: #1F2A23; border-color: #C9D3CB; }
  .diag[hidden] { display: none; }
  .diag-tech { margin-top: 6px; font: 12px/1.4 ui-monospace, Menlo, monospace; opacity: 0.85; word-break: break-word; }
</style>
</head>
<body>
<div class="card" id="app"><div class="skel" aria-busy="true">
  <span class="say">Reading your plan from Garmin&hellip;</span>
  <i style="height:26px;width:60%"></i><i style="height:58px"></i><i style="height:120px"></i><i style="height:58px"></i><i style="height:58px"></i>
</div></div>
<div class="diag" id="diag" hidden></div>
<script>
// Watchdog. Runs before the view itself, so it can say what happened even if
// the view's script never starts: how far the conversation with the host got,
// what the host called itself, and any error. Shown only if the plan hasn't
// appeared after a few seconds, and removed the moment it does.
(function () {
  var d = window.__planDiag = { steps: [], errors: [], host: "", rendered: false, gotResult: false, initOk: false,
    seen: "", told: "", start: Date.now() };
  // Once per answer, when the card has drawn it or has failed to: tells Daash
  // which, on the link the answer carried. The plan the card fetches for itself
  // carries its own link. Nothing else leaves the frame.
  function tell() {
    if (!d.seen || d.told === d.seen || !window.fetch) return;
    d.told = d.seen;
    try {
      fetch(d.seen, { method: "POST", mode: "no-cors", keepalive: true, body: JSON.stringify({
        card: "plan2", ok: d.rendered && !d.errors.length, ms: Date.now() - d.start, host: d.host,
        error: d.errors.join("; "), steps: d.steps.join(" > ") }) }).catch(function () {});
    } catch (e) {}
  }
  // A tap on Open in Daash, and whether the chat app opened the link: on
  // the same link, as many times as it's tapped (Nov 6: 71 cards carried it
  // and not one sign-in came of it, with nothing to say whether anyone tried).
  d.tapped = function (what, opened) {
    if (!d.seen || !window.fetch) return;
    try {
      fetch(d.seen, { method: "POST", mode: "no-cors", keepalive: true, body: JSON.stringify({
        card: "plan", tap: what, opened: opened, host: d.host }) }).catch(function () {});
    } catch (e) {}
  };
  function show() {
    tell();
    var box = document.getElementById("diag");
    if (!box) return;
    if (d.rendered && !d.errors.length) { box.hidden = true; return; }
    var waiting = d.initOk && !d.gotResult && !d.errors.length;
    box.className = "diag" + (waiting ? " waiting" : "");
    box.textContent = "";
    var head = document.createElement("strong");
    head.textContent = waiting ? "Still fetching your plan from Garmin\u2026" : "The plan didn't load here.";
    box.appendChild(head);
    if (!waiting) {
      var hint = document.createElement("div");
      hint.textContent = "Ask Claude to show it as text instead.";
      box.appendChild(hint);
    }
    var tech = document.createElement("div");
    tech.className = "diag-tech";
    tech.textContent = d.steps.join(" > ") + (d.host ? " | app: " + d.host : "") +
      (d.errors.length ? " | error: " + d.errors.join("; ") : "");
    box.appendChild(tech);
    box.hidden = false;
  }
  d.step = function (s) { if (d.steps.length < 24) d.steps.push(s); };
  d.fail = function (msg) { d.errors.push(String(msg).slice(0, 160)); show(); };
  d.done = function () { d.rendered = true; show(); };
  window.addEventListener("error", function (e) { d.fail(e.message || "script error"); });
  window.addEventListener("unhandledrejection", function (e) {
    d.fail((e.reason && e.reason.message) || "promise rejected");
  });
  // Before the plan arrives there is no link of its own to report on, so the
  // card says it opened, and if it's still waiting at 8 seconds, how far it
  // got, to the address the hosted server writes in. Nothing names anyone.
  function early(stage) {
    var at = window.__DAASH_CARD_OPENED__;
    if (!at || !window.fetch) return;
    try {
      fetch(at, { method: "POST", mode: "no-cors", keepalive: true, body: JSON.stringify({
        card: "plan2", stage: stage, ms: Date.now() - d.start, host: d.host, error: d.errors.join("; "),
        steps: d.steps.join(" > ") }) }).catch(function () {});
    } catch (e) {}
  }
  setTimeout(function () { if (!d.gotResult) early("waiting"); show(); }, 8000);
  setTimeout(show, 30000);
  d.step("page");
  early("opened");
})();
</script>
<script>
(function () {
  "use strict";
  var D = window.__planDiag || { step: function () {}, fail: function () {}, done: function () {} };

  // ---------------------------------------------------------------- bridge
  // The host speaks JSON-RPC over postMessage. Only the handful of messages
  // this view needs are implemented, so there is no SDK to load.
  var host = window.parent !== window ? window.parent : null;
  var nextId = 1, pending = {}, hostContext = {}, hostCaps = null;

  function send(msg) { if (host) host.postMessage(Object.assign({ jsonrpc: "2.0" }, msg), "*"); }
  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      send({ id: id, method: method, params: params || {} });
      setTimeout(function () { if (pending[id]) { delete pending[id]; reject(new Error("timeout")); } }, 20000);
    });
  }
  function notify(method, params) { send({ method: method, params: params || {} }); }

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (data && data.jsonrpc !== "2.0") { D.step("other msg " + String(data.type || typeof data).slice(0, 40)); return; }
    if (!data) return;
    if (data.id != null && !data.method && pending[data.id]) {
      var p = pending[data.id]; delete pending[data.id];
      data.error ? p.reject(new Error(data.error.message || "error")) : p.resolve(data.result);
      return;
    }
    switch (data.method) {
      case "ui/notifications/tool-input": D.step("input"); break;
      case "ui/notifications/tool-result": D.step("result"); D.gotResult = true; onResult(data.params); break;
      case "ui/notifications/host-context-changed": applyContext(data.params || {}); break;
      case "ui/notifications/tool-cancelled": D.step("cancelled"); fail("The plan could not be loaded."); D.done(); break;

      kicker = (model.block.name || goalTitle(model.block.goal) || "Training plan").replace(/\s*[(:].*$/, "");
      if (model.block === raw) {
        var wi = model.weeks.findIndex(function (w) { return day >= w.starts && day < iso(addDays(parse(w.starts), 7)); });
        if (wi >= 0) kicker += " \u00b7 Week " + (wi + 1) + " of " + model.weeks.length;
      }
    }
    title = title.replace(/(\d) (km|mi|min)\b/g, "$1\u00a0$2");
    var out = { v: 1, run: 1, t: title, s: sub, k: kicker, c: colourOf(s), f: facts, l: laps, a: paceSecs(pace), n: notes.slice(0, 3),
      // Garmin's credit for the run's own watch, from its details (Nov 10).
      g: (p && p.credit) || "Garmin" };
    var planned = plannedFor(s);
    if (planned) out.pl = planned;
    return out;
  }
  // The planned session a run was, for its Strava caption, as share.py's
  // plan_context says it: { n, ty, k, w, b }. None for a run off the plan.
  function plannedFor(s) {
    if (!s || s.extra || !/^done/.test(String(s.status || ""))) return null;
    var name = String(s.name || "Run").replace(/\s*\u00b7\s*[A-Z0-9]{1,6}$/, "").trim()
      .replace(/(\d+(?:[.,]\d+)?)\s*k(?:m)?\b/gi, "$1 km").replace(/(\d)\s*[x\u00d7]\s*(\d)/gi, "$1 \u00d7 $2");
    var pl = { n: (name.charAt(0).toUpperCase() + name.slice(1)).slice(0, 60), ty: s.type, k: s.planned_km };
    var r = raw || {}, day = String(s.date || "").slice(0, 10), weeks = r.weeks || [];
    var monday = function (iso) { var d = parse(iso); return d.getTime() - dow(iso) * 864e5; };
    if (r.label) {
      var wi = weeks.findIndex(function (w) { return (w.sessions || []).indexOf(s) >= 0; });
      if (wi >= 0) pl.w = [wi + 1, r.weeks_total || weeks.length];
      if (r.name || r.goal) pl.b = String(r.name || String(r.goal).replace(/\s*[(:,].*$/, "")).slice(0, 40);
    } else {
      ["current_plan", "upcoming_plan"].some(function (key) {
        var p = r[key];
        if (!p || !p.starts || !p.ends || day < p.starts || day > p.ends) return false;
        if (p.weeks_total) pl.w = [Math.round((monday(day) - monday(p.starts)) / (7 * 864e5)) + 1, p.weeks_total];
        if (p.name || p.goal) pl.b = String(p.name || String(p.goal).replace(/\s*[(:,].*$/, "")).slice(0, 40);
        return true;
      });
    }
    Object.keys(pl).forEach(function (k) { if (pl[k] == null) delete pl[k]; });
    return pl;
  }
  function shareRun(p, s, btn) {
    var url = shareLink(runPayload(p, s)), opened;
    if (window.openai && typeof window.openai.openExternal === "function") {
      opened = Promise.resolve().then(function () { return window.openai.openExternal({ href: url }); });
    } else if (!host) {
      opened = Promise.resolve(window.open(url, "_blank", "noopener"));
    } else {
      opened = request("ui/open-link", { url: url });
    }
    btn.disabled = true;
    opened.then(function () { btn.textContent = "Opened in the browser"; })
      .catch(function () { btn.textContent = "This chat app didn\u2019t open the link"; })
      .then(function () { btn.disabled = false; });
  }
  function shareWords(m) { return planPayload(m) ? "Share or save your plan" : "Share this week as an image"; }
  function shareLink(data) {
    var text = unescape(encodeURIComponent(JSON.stringify(data)));
    return SHARE_PAGE + "#" + btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function share(event) {
    var data = sharePayload(model), whole = planPayload(model);
    if (whole) data.p = whole;
    var btn = event.currentTarget, url = shareLink(data);
    var said = function (msg) {
      var head = document.querySelector(".head"); if (!head) return;
      var note = head.querySelector(".note") || head.appendChild(el("div", { class: "note", role: "status" }));
      note.textContent = msg;
      requestAnimationFrame(function () { note.classList.add("on"); });
      clearTimeout(said.t); said.t = setTimeout(function () { note.classList.remove("on"); }, 4000);
    };
    var opened;
    if (window.openai && typeof window.openai.openExternal === "function") {
      opened = Promise.resolve().then(function () { return window.openai.openExternal({ href: url }); });
    } else if (!host) {
      opened = Promise.resolve(window.open(url, "_blank", "noopener"));
    } else {
      opened = request("ui/open-link", { url: url });
    }
    btn.disabled = true;
    opened.then(function () { said(whole ? "Your plan opens in the browser to share or save." : "Your week opens in the browser as an image."); })
      .catch(function () { said("This chat app didn\u2019t open the link."); })
      .then(function () { btn.disabled = false; });
  }

  function refresh(event) {
    var btn = event.currentTarget;
    if (!host) return;
    btn.classList.add("spin");
    request("tools/call", { name: "get_plan", arguments: raw && raw.label ? { label: raw.label } : {} })
      .then(function (r) { onResult(r); })
      .catch(function () {})
      .then(function () { var b = document.querySelector(".refresh"); if (b) b.classList.remove("spin"); });
  }

  // ---------------------------------------------------------------- progress
  // get_progress answers "how's my plan going" too, with the same sessions in
  // three lists. Drawn as the calendar version of the plan.
  function isCreatedSummary(p) {
    return !!(p && !p.error && p.sessions_created != null && p.label && !Array.isArray(p.weeks));
  }
  function isProgress(p) {
    return !!(p && !p.error && Array.isArray(p.upcoming) && Array.isArray(p.sessions) && p.weeks && p.weeks.length && "week_of" in p.weeks[0]);
  }
  function fromProgress(p) {
    var today = iso(new Date());
    var earliest = p.weeks[0].week_of;
    var horizon = iso(addDays(mondayOf(new Date()), 28));
    var rows = [];
    (p.sessions || []).forEach(function (r) {
      rows.push({ date: r.date, name: r.name, sport: r.sport, status: r.done_on && r.done_on !== r.date ? "done, moved" : "done",
        done_on: r.done_on !== r.date ? r.done_on : undefined, activity_id: r.activity_id, actual_km: r.actual_km });
    });
    (p.missed || []).forEach(function (r) { rows.push({ date: r.date, name: r.name, sport: r.sport, status: r.date === today ? "today" : "missed" }); });
    (p.upcoming || []).forEach(function (r) { rows.push({ date: r.date, name: r.name, sport: r.sport, status: r.date === today ? "today" : "ahead" }); });
    rows = rows.filter(function (r) { return r.date >= earliest && r.date < horizon; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    if (!rows.length) return { error: "Nothing is scheduled on the Garmin calendar in the weeks around this one." };
    rows.forEach(function (r) { r.day = DAYS[dow(r.date)]; r.type = r.sport === "run" ? undefined : r.sport; });
    var weeks = {}, order = [];
    rows.forEach(function (r) {
      var start = iso(mondayOf(parse(r.date)));
      if (!weeks[start]) { weeks[start] = { starts: start, sessions: [], current: start === iso(mondayOf(new Date())) }; order.push(start); }
      weeks[start].sessions.push(r);
    });
    var list = order.map(function (start, i) { var w = weeks[start]; w.week = i + 1; return w; });
    var ahead = rows.filter(function (r) { return r.status === "today" || r.status === "ahead"; });
    return { source: "calendar", starts: rows[0].date, ends: rows[rows.length - 1].date, weeks: list, next_session: ahead[0] || null };
  }

  // ---------------------------------------------------------------- start
  if (window.__PLAN_DEMO__) { raw = window.__PLAN_DEMO__; render(raw); D.done(); return; }
  if (!host) { D.step("no host frame"); fail("This view opens inside a chat that supports MCP Apps."); D.done(); return; }
  D.step("init sent");
  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "garmin-plan", version: "3.0.0" },
    clientInfo: { name: "garmin-plan", version: "2.0.0" },
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
  }).then(function (result) {
    var info = (result && (result.hostInfo || result.serverInfo)) || {};
    var ctx = (result && result.hostContext) || {};
    D.initOk = true;
    D.host = [info.name, info.version, ctx.platform, ctx.theme, ctx.displayMode].filter(Boolean).join(" ") || "unnamed";
    hostCaps = (result && result.hostCapabilities) || null;
    D.step("init ok");
    applyContext(ctx);
    notify("ui/notifications/initialized", {});
    D.step("ready sent");
  }).catch(function (e) {
    D.step("init failed: " + (e && e.message));
    notify("ui/notifications/initialized", {});
  });
})();
</script>
</body>
</html>
