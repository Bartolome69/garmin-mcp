<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daash crew</title>
<style>
  /* A Daash crew's week, drawn inside the chat by get_crew and join_crew.
     Three jobs: show who runs when, list the runs worth doing together with
     a button to act on each, and hand over a message for the group chat.
     Same palette and type as the plan card, so the two read as one product. */
  :root {
    color-scheme: light;
    --card: #FFFFFF; --border: #E6E4DD; --text: #1F1E1B; --muted: #6B6A64; --faint: #9A9993;
    --soft: #4A4944; --row-line: #EEECE6; --cell: #F2F1EC; --btn-border: #D9D7CF;
    --red: #E0312A; --red-text: #C8261F; --red-wash: #FDF4F2; --red-edge: #F2C9C4;
    --easy: #3F8A47; --easy-wash: #E3EFE2; --long: #2F68B0; --long-wash: #E0E9F5; --club: #7E57C2; --club-wash: #EEE7F8;
    --on-red: #FFFFFF; --on-club: #FFFFFF; --page: #F5F4EF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --card: #30302E; --border: #42423F; --text: #F4F3EE; --muted: #A6A59F; --faint: #75746F;
      --soft: #C9C8C2; --row-line: #3C3C39; --cell: #3A3A37; --btn-border: #55544F;
      --red: #E8322B; --red-text: #FF6A61; --red-wash: #3B3B38; --red-edge: #6B3530;
      --easy: #8CC08F; --easy-wash: #34443A; --long: #74A3DB; --long-wash: #2F3D4F; --club: #B39DDB; --club-wash: #3D3550; --on-club: #1F1E1B;
      --page: #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --card: #30302E; --border: #42423F; --text: #F4F3EE; --muted: #A6A59F; --faint: #75746F;
    --soft: #C9C8C2; --row-line: #3C3C39; --cell: #3A3A37; --btn-border: #55544F;
    --red: #E8322B; --red-text: #FF6A61; --red-wash: #3B3B38; --red-edge: #6B3530;
    --easy: #8CC08F; --easy-wash: #34443A; --long: #74A3DB; --long-wash: #2F3D4F; --club: #B39DDB; --club-wash: #3D3550; --on-club: #1F1E1B;
    --page: #262624;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { color: var(--text); font: 14px/1.4 Geist, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
  .empty { padding: 28px 20px; color: var(--muted); }
  .head { position: relative; padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .wordmark { font-weight: 800; font-style: italic; letter-spacing: -0.03em; color: var(--red-text); font-size: 15px; }
  .kicker { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
  .tools { position: absolute; top: 16px; right: 16px; display: flex; gap: 6px; }
  .refresh, .share { width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--btn-border); background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--muted); }
  .refresh.spin svg { animation: spin 0.9s linear infinite; }
  .refresh:hover, .share:hover { border-color: var(--muted); color: var(--text); }
  .note { position: absolute; top: 54px; right: 16px; z-index: 2; max-width: 260px; padding: 8px 12px; border-radius: 10px;
    background: var(--text); color: var(--card); font-size: 12.5px; line-height: 1.35; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
  .note.on { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; overflow-wrap: anywhere; }
  .sub { font-size: 13.5px; color: var(--muted); }
  .weeks { display: inline-flex; gap: 3px; padding: 3px; border-radius: 999px; background: var(--cell); align-self: flex-start; }
  .weeks button { border: 0; background: transparent; color: var(--muted); height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; }
  .weeks button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .just { margin: 12px 16px 0; padding: 10px 12px; border-radius: 12px; background: var(--red-wash); border: 1px solid var(--red-edge); font-size: 13.5px; }
  .just b { font-weight: 600; }

  .grid-wrap { overflow-x: auto; padding: 14px 16px 4px; }
  .grid { display: grid; grid-template-columns: minmax(58px, 1.2fr) repeat(7, minmax(30px, 1fr)); gap: 4px; min-width: 300px; }
  .dh { display: flex; flex-direction: column; align-items: center; gap: 1px; padding-bottom: 2px; }
  .dh .l { font-size: 10.5px; color: var(--faint); }
  .dh .n { font-size: 12px; font-weight: 600; width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; }
  .dh.today .n { background: var(--red); color: var(--on-red); }
  .dh.past .n { color: var(--faint); font-weight: 500; }
  .who { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding-right: 4px; }
  .who .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .nm.you { color: var(--red-text); }
  .who .stale { font-size: 10.5px; color: var(--faint); white-space: nowrap; }
  .cell { min-height: 34px; border-radius: 8px; background: var(--cell); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; color: var(--muted); }
  .cell.past { opacity: 0.45; }
  .cell b { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1; }
  .cell .k { font-size: 9.5px; letter-spacing: 0.04em; line-height: 1.1; }
  .cell.easy { background: var(--easy-wash); }
  .cell.easy .k { color: var(--easy); }
  .cell.long { background: var(--long-wash); }
  .cell.long .k { color: var(--long); }
  .cell.club { background: var(--club); }
  .cell.club b, .cell.club .k { color: var(--on-club); }
  .cell.hard { background: transparent; border: 1px dashed var(--btn-border); }
  /* A run someone else in the crew is doing the same day: inset, so nothing moves. */
  .cell.match { box-shadow: inset 0 0 0 2px var(--red); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding: 8px 16px 2px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  .sec { padding: 12px 16px 4px; font-size: 16px; font-weight: 600; }
  .runs { display: flex; flex-direction: column; padding-bottom: 6px; }
  .run { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding: 11px 16px; border-top: 1px solid var(--row-line); }
  .run .day { font-size: 11px; color: var(--muted); padding-top: 2px; }
  .run .day b { display: block; font-size: 15px; color: var(--text); font-weight: 600; }
  .run .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .run .what { font-size: 14px; font-weight: 600; display: flex; gap: 7px; align-items: baseline; flex-wrap: wrap; }
  .run .tag { font-size: 11.5px; font-weight: 600; }
  .run .meta { font-size: 13px; color: var(--muted); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .act { height: 34px; border-radius: 999px; border: 1px solid var(--btn-border); background: transparent; font-size: 13px; font-weight: 500; padding: 0 14px; }
  .act:hover { border-color: var(--muted); }
  .act.go { background: var(--red); border-color: var(--red); color: var(--on-red); }
  .pill { display: inline-block; font-size: 11.5px; padding: 3px 8px; border-radius: 999px; background: var(--cell); color: var(--soft); font-weight: 500; }
  .none { padding: 12px 16px 14px; color: var(--muted); font-size: 13.5px; border-top: 1px solid var(--row-line); }
  .sent { font-size: 12.5px; color: var(--muted); }

  .foot { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 14px; border-top: 1px solid var(--border); }
  .foot .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .foot .code { font-size: 13px; color: var(--muted); }
  .foot .code b { color: var(--text); font-weight: 600; letter-spacing: 0.04em; }
  textarea { width: 100%; min-height: 120px; border-radius: 10px; border: 1px solid var(--btn-border); background: var(--cell); color: var(--text); font: 13px/1.45 inherit; padding: 10px; resize: vertical; }
  textarea[hidden] { display: none; }
  /* The crew's own web page: the same card, on a page of its own. */
  html.page, html.page body { background: var(--page); }
  html.page body { padding: 16px; }
  html.page #app { max-width: 680px; margin: 0 auto; }
  .promo { font-size: 13px; color: var(--muted); }
  .promo a { color: var(--red-text); font-weight: 600; text-decoration: none; }
  .link-row { font-size: 13px; color: var(--muted); }
  .link-row button { border: 0; background: none; padding: 0; color: var(--red-text); font-weight: 600; font-size: 13px; }
  /* Adding your own easy runs on the crew's page. */
  .editor { margin: 4px 16px 12px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; gap: 12px; }
  .editor h4 { margin: 0; font-size: 15px; }
  .editor .hint { font-size: 12.5px; color: var(--muted); margin: 0; }
  .pick { display: grid; grid-template-columns: minmax(64px, 1.2fr) repeat(7, minmax(30px, 1fr)); gap: 4px; }
  .pick .l { font-size: 12px; color: var(--muted); display: flex; align-items: center; }
  .pick .h { font-size: 10.5px; color: var(--faint); text-align: center; }
  .pick button { height: 36px; border-radius: 8px; border: 1px solid var(--btn-border); background: transparent; padding: 0; font-size: 11px; color: var(--faint); }
  .pick button[aria-pressed="true"] { background: var(--easy-wash); border-color: var(--easy); color: var(--easy); font-weight: 600; }
  .pick button:disabled { opacity: 0.35; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
  .field input, .field select { height: 38px; border-radius: 10px; border: 1px solid var(--btn-border); background: var(--cell); color: var(--text); padding: 0 10px; font: inherit; font-size: 15px; }
  .fields { display: flex; gap: 10px; flex-wrap: wrap; }
  .fields .field { flex: 1 1 140px; }
  .err { font-size: 13px; color: var(--red-text); margin: 0; }
  .club-pick { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--btn-border);
    background: transparent; color: var(--text); font: inherit; font-size: 14px; text-align: left; }
  .club-pick .box { flex: none; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--btn-border); display: flex; align-items: center; justify-content: center; }
  .club-pick[aria-pressed="true"] { border-color: var(--club); background: var(--club-wash); }
  .club-pick[aria-pressed="true"] .box { background: var(--club); border-color: var(--club); color: var(--on-club, #FFFFFF); }
  .plain-btn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="card" id="app"><div class="empty">Loading your crew&hellip;</div></div>
<script>
(function () {
  "use strict";
  // ---------------------------------------------------------------- bridge
  // The same handful of MCP Apps messages the plan card speaks.
  var host = window.parent !== window ? window.parent : null;
  var nextId = 1, pending = {}, data = null, hostCaps = null;
  function send(msg) { if (host) host.postMessage(Object.assign({ jsonrpc: "2.0" }, msg), "*"); }
  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      send({ id: id, method: method, params: params || {} });
      setTimeout(function () { if (pending[id]) { delete pending[id]; reject(new Error("timeout")); } }, 20000);
    });
  }
  function notify(method, params) { send({ method: method, params: params || {} }); }
  window.addEventListener("message", function (event) {
    var m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && !m.method && pending[m.id]) {
      var p = pending[m.id]; delete pending[m.id];
      m.error ? p.reject(new Error(m.error.message || "error")) : p.resolve(m.result);
      return;
    }
    if (m.method === "ui/notifications/tool-result") show(m.params);
    else if (m.method === "ui/notifications/host-context-changed") theme(m.params || {});
    else if ((m.method === "ui/resource-teardown" || m.method === "ping") && m.id != null) send({ id: m.id, result: {} });
  });
  function theme(ctx) {
    if (ctx.theme) document.documentElement.setAttribute("data-theme", ctx.theme);
    var fonts = ctx.styles && ctx.styles.css && ctx.styles.css.fonts;
    if (fonts && !document.getElementById("host-fonts")) {
      var st = document.createElement("style"); st.id = "host-fonts"; st.textContent = fonts; document.head.appendChild(st);
    }
  }
  var sent = 0;
  function size() {
    requestAnimationFrame(function () {
      var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (host && h && h !== sent) { sent = h; notify("ui/notifications/size-changed", { width: Math.ceil(window.innerWidth), height: h }); }
    });
  }
  if (window.ResizeObserver) new ResizeObserver(size).observe(document.body);

  // ---------------------------------------------------------------- helpers
  var DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], LETTERS = ["M", "T", "W", "T", "F", "S", "S"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function parse(s) { var p = String(s).slice(0, 10).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function dow(s) { return (parse(s).getDay() + 6) % 7; }
  function longDay(s) { var d = parse(s); return DAYS[dow(s)] + " " + d.getDate() + " " + MONTHS[d.getMonth()]; }
  function km(n) { if (n == null) return ""; var r = Math.round(n * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); }
  function kmRange(lo, hi) { if (!lo) return ""; return (hi && hi !== lo) ? km(lo) + " to " + km(hi) + " km" : km(lo) + " km"; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "onclick") n.addEventListener("click", attrs[k]);
      else if (k === "oninput") n.addEventListener("input", attrs[k]);
      else if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c == null || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function names(list) {
    if (!list.length) return "nobody yet";
    if (list.length === 1) return list[0];
    return list.slice(0, -1).join(", ") + " and " + list[list.length - 1];
  }
  var KIND = { easy: { l: "Easy", c: "var(--easy)" }, long: { l: "Long", c: "var(--long)" }, club: { l: "Club run", c: "var(--club)" },
    mixed: { l: "Easy and long", c: "var(--long)" } };

  // ---------------------------------------------------------------- drawing
  function show(result) {
    var d = result && result.structuredContent;
    if (!d && result && result.content) {
      for (var i = 0; i < result.content.length; i++) {
        if (result.content[i].type === "text") { try { d = JSON.parse(result.content[i].text); break; } catch (e) {} }
      }
    }
    var app = document.getElementById("app");
    app.textContent = "";
    if (!d || d.error || !d.crew) { app.appendChild(el("div", { class: "empty", text: (d && d.error) || "The crew could not be loaded." })); size(); return; }
    data = d;
    var meNow = PAGE ? mine() : null;
    if (meNow) {
      d.members.forEach(function (m) { if (m.by_hand && m.id === meNow.id) m.you = true; });
      d.together.forEach(function (t) { if (t.who.indexOf(meNow.name) >= 0) t.you_in = true; });
    }
    var monday = parse(d.week.starts), today = d.today;
    var sub = d.crew.members + (d.crew.members === 1 ? " member" : " members") + " · " +
      monday.getDate() + (monday.getMonth() !== addDays(monday, 6).getMonth() ? " " + MONTHS[monday.getMonth()] : "") +
      "–" + addDays(monday, 6).getDate() + " " + MONTHS[addDays(monday, 6).getMonth()];
    var head = el("div", { class: "head" }, [
      el("div", { class: "brand" }, [el("span", { class: "wordmark", text: "Daash" }), el("span", { class: "kicker mono", text: "CREW" })]),
      el("span", { class: "tools" }, [
        canOpen() ? el("button", { class: "share", "aria-label": "Share the crew's week as an image", title: "Share the crew's week as an image", onclick: shareImage },
          [svg('<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/>')]) : null,
        el("button", { class: "refresh", "aria-label": "Refresh", onclick: refresh },
          [svg('<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>')]),
      ]),
      el("h3", { class: "title", text: d.crew.name }),
      el("span", { class: "sub", text: sub }),
      weekPicker(d),
    ]);
    app.appendChild(head);
    if (d.just) {
      app.appendChild(el("div", { class: "just" }, d.just.action === "started"
        ? ["You started ", el("b", { text: d.just.crew }), ". Invite friends with the code ", el("b", { text: d.just.code }), "."]
        : ["You're in ", el("b", { text: d.just.crew }), ". Your runs show here once you've looked at your plan."]));
    }

    // Who runs when, with the runs that line up outlined.
    var matched = {};
    d.together.forEach(function (t) {
      if (t.kind === "club") return;
      t.who.forEach(function (n) { matched[n + "|" + t.date] = true; });
    });
    var grid = el("div", { class: "grid", role: "table", "aria-label": "Each member's runs by day this week" }, [el("span")]);
    for (var k = 0; k < 7; k++) {
      var date = iso(addDays(monday, k));
      grid.appendChild(el("div", { class: "dh" + (date === today ? " today" : date < today ? " past" : "") }, [
        el("span", { class: "l mono", text: LETTERS[k] }), el("span", { class: "n", text: String(addDays(monday, k).getDate()) })]));
    }
    d.members.forEach(function (m) {
      var stale = !m.updated_on ? "no week yet" : (daysBetween(m.updated_on, today) > 3 ? "as of " + DAYS[dow(m.updated_on)] : "");
      grid.appendChild(el("div", { class: "who" }, [
        el("span", { class: "nm" + (m.you ? " you" : ""), text: m.name, title: m.you ? "You" : m.name }),
        stale ? el("span", { class: "stale", text: stale }) : (m.by_hand ? el("span", { class: "stale", text: "by hand" }) : null),
      ]));
      m.days.forEach(function (runs, j) {
        var date = iso(addDays(monday, j)), past = date < today;
        var top = runs.filter(function (r) { return r.kind === "club"; })[0] || runs.filter(function (r) { return r.kind === "long"; })[0] ||
          runs.filter(function (r) { return r.kind === "easy"; })[0] || runs.filter(function (r) { return r.kind === "hard"; })[0];
        var label = top ? (top.kind === "hard" ? "hard" : top.kind === "club" ? "club" : top.kind) : "";
        var same = top && top.kind !== "club" && matched[m.name + "|" + date];
        grid.appendChild(el("div", { class: "cell" + (top ? " " + top.kind : "") + (past ? " past" : "") + (same ? " match" : ""),
          "aria-label": top ? m.name + ", " + DAYS[j] + ": " + label + (top.km ? " " + km(top.km) + " km" : "") + (same ? ", same day as others" : "") : m.name + ", " + DAYS[j] + ": nothing" },
          top ? [top.km ? el("b", { text: km(top.km) }) : (top.when ? el("b", { text: top.when.map(function (w) { return WHEN[w]; }).join(" ") }) : null),
            el("span", { class: "k", text: label })] : []));
      });
    });
    app.appendChild(el("div", { class: "grid-wrap" }, [grid]));
    app.appendChild(el("div", { class: "legend" }, [
      el("span", {}, [el("i", { class: "sw", style: "background:var(--easy)" }), "Easy"]),
      el("span", {}, [el("i", { class: "sw", style: "background:var(--long)" }), "Long"]),
      el("span", {}, [el("i", { class: "sw", style: "background:var(--club)" }), "Club run"]),
      el("span", {}, [el("i", { class: "sw", style: "border:1px dashed var(--faint)" }), "Hard, run alone"]),
      Object.keys(matched).length ? el("span", {}, [el("i", { class: "sw", style: "box-shadow:inset 0 0 0 2px var(--red)" }), "Same day"]) : null,
    ]));

    if (PAGE) app.appendChild(runnerPanel(d));

    // What to run together.
    app.appendChild(el("div", { class: "sec", text: "Same day" }));
    var list = el("div", { class: "runs" });
    var me = (d.members.filter(function (m) { return m.you; })[0] || {}).name;
    d.together.forEach(function (t) {
      var kind = KIND[t.kind] || KIND.easy, dd = parse(t.date);
      var title = t.kind === "club" ? "Club run" : t.kind === "mixed" ? "Easy and long runs" : kind.l + " run";
      var bits = [kmRange(t.km_lo, t.km_hi), t.when, t.place].filter(Boolean).join(" · ");
      var order = t.who.filter(function (n) { return n === me; }).map(function () { return "you"; })
        .concat(t.who.filter(function (n) { return n !== me; }));
      var who = t.who.length ? names(order) + (t.kind === "club" ? " going" : " running")
        : "Nobody has said they're going yet";
      var acts = [];
      if (t.you_in) acts.push(el("span", { class: "pill", text: "You're running that day" }));
      list.appendChild(el("div", { class: "run" }, [
        el("div", { class: "day mono" }, [DAYS[dow(t.date)].toUpperCase(), el("b", { text: String(dd.getDate()) })]),
        el("div", { class: "body" }, [
          el("div", { class: "what" }, [el("span", { class: "tag", style: "color:" + kind.c, text: title }), bits ? el("span", { text: bits }) : null]),
          el("div", { class: "meta", text: cap(who) + "." }),
          acts.length ? el("div", { class: "acts" }, acts) : null,
        ]),
      ]));
    });
    if (!d.together.length) list.appendChild(el("div", { class: "none", text: "Nothing lines up yet this week" + (d.club_run ? ", apart from the club run" : "") + ". Runs appear here as members look at their plans in Daash." }));
    app.appendChild(list);

    // For the group chat.
    var box = el("textarea", { id: "msg", "aria-label": "Message for the group chat", readonly: true, hidden: true });
    box.value = d.group_message || "";
    var status = el("span", { class: "sent", role: "status" });
    app.appendChild(el("div", { class: "foot" }, [
      el("div", { class: "row" }, [
        el("div", { class: "acts" }, [
          el("button", { class: "act go", onclick: function () { copy(box, status); } }, ["Copy for the group chat"]),
          canOpen() ? el("button", { class: "act", onclick: function () { whatsapp(box.value, status); } }, ["Send to WhatsApp"]) : null,
        ]),
        d.crew.code ? el("span", { class: "code" }, ["Invite code ", el("b", { class: "mono", text: d.crew.code })]) : null,
      ]),
      d.crew.page_url ? el("div", { class: "link-row" }, ["The crew's page is on: anyone with the link can see this week and next. ",
        el("button", { type: "button", onclick: function () { copyText(d.crew.page_url, status, "Link copied. Pin it in the group chat's description."); } }, ["Copy link"])])
        : (host && d.crew.you_started_it ? el("div", { class: "link-row body" }, [
          el("button", { type: "button", onclick: function (e) { ask("Turn on a link to my crew's page, so the group can see our week any time", e.currentTarget); } }, ["Get a link for the group"])]) : null),
      PAGE && PAGE.promo ? el("div", { class: "promo" }, [PAGE.promo.text + " ",
        el("a", { href: PAGE.promo.url, target: "_blank", rel: "noopener" }, [PAGE.promo.link])]) : null,
      status, box,
    ]));
    size();
  }

  // This week and next: the crew keeps two weeks of runs, so those are the two to show.
  // The crew's web page sets this; it reads the crew from its own address
  // instead of asking the chat for get_crew.
  var PAGE = window.__CREW_PAGE__ || null;
  function getWeek(args) {
    if (PAGE) {
      return fetch(location.pathname + "?format=json" + (args.week_of ? "&week_of=" + encodeURIComponent(args.week_of) : ""),
        { credentials: "omit", cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("unavailable")); })
        .then(function (card) { return { structuredContent: card }; });
    }
    return request("tools/call", { name: "get_crew", arguments: args });
  }
  // ---------------------------------------------------------------- runners without Daash
  // On the crew's page, anyone with the link can add the easy runs of their
  // usual week, and change any day this week or next. Their phone remembers
  // them; a name and four-digit PIN let them back in on another.
  var WHEN = { morning: "AM", afternoon: "Aft", evening: "PM" };
  var SLOT_NAMES = [["morning", "Morning"], ["afternoon", "Afternoon"], ["evening", "Evening"]];
  var KEYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
  var ed = null, checked = false;
  function storeKey() { return "daash-crew:" + location.pathname.split("/").pop(); }
  function mine() { try { var v = JSON.parse(localStorage.getItem(storeKey()) || "null"); return v && v.token ? v : null; } catch (e) { return null; } }
  function remember(v) { try { localStorage.setItem(storeKey(), JSON.stringify({ token: v.token, id: v.id, name: v.name })); } catch (e) {} }
  function forgetMe() { try { localStorage.removeItem(storeKey()); } catch (e) {} }
  function post(action, body) {
    return fetch(location.pathname + "/runner", {
      method: "POST", credentials: "omit", cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ action: action }, body || {})),
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "That didn't work."); return j; }); });
  }
  function rerender() { show({ structuredContent: data }); }
  function reload() { return getWeek(data && data.week ? { week_of: data.week.starts } : {}).then(function (r) { ed = null; show(r); }); }
  function fail(e) { if (ed) { ed.error = e.message; ed.busy = false; rerender(); } }
  function mondayOf(isoDay) { var t = parse(isoDay); return addDays(t, -((t.getDay() + 6) % 7)); }

  function runnerPanel(d) {
    var me = mine();
    if (me && !checked) {
      // Once per visit: are they still on the page, and still running these days?
      checked = true;
      post("mine", { token: me.token }).then(function (r) {
        if (r.stale) { ed = { mode: "stale" }; rerender(); }
        else post("update", { token: me.token, still_running: true }).catch(function () {});
      }, function () { forgetMe(); ed = null; rerender(); });
    }
    if (!ed && me) {
      return el("div", { class: "editor" }, [
        el("p", { class: "hint" }, ["You're on this page as ", el("b", { text: me.name }), "."]),
        el("div", { class: "acts" }, [el("button", { class: "act", type: "button", onclick: function () { openEdit(me); } }, ["Edit my runs"])]),
      ]);
    }
    if (!ed) {
      return el("div", { class: "editor" }, [
        el("h4", { text: "Not on Daash? Add your easy runs" }),
        el("p", { class: "hint", text: "Tap the times you usually run easy. They repeat every week, so the crew can see when to run with you. No account needed." }),
        el("div", { class: "acts" }, [
          el("button", { class: "act go", type: "button", onclick: function () { ed = { mode: "add", usual: {}, tab: "usual" }; rerender(); } }, ["Add your easy runs"]),
          d.members.some(function (m) { return m.by_hand; })
            ? el("button", { class: "plain-btn", type: "button", onclick: function () { ed = { mode: "sign_in" }; rerender(); } }, ["Already added? Sign in"]) : null,
        ]),
      ]);
    }
    if (ed.mode === "stale") {
      return el("div", { class: "editor" }, [
        el("h4", { text: "Still running these days?" }),
        el("p", { class: "hint", text: "It's been a few weeks, so your runs aren't being matched until you say." }),
        el("div", { class: "acts" }, [
          el("button", { class: "act go", type: "button", onclick: function () {
            post("update", { token: me.token, still_running: true }).then(reload, fail); } }, ["Yes, same as before"]),
          el("button", { class: "act", type: "button", onclick: function () { openEdit(me); } }, ["Update my runs"]),
        ]),
      ]);
    }
    if (ed.mode === "sign_in") return signInPanel(d);
    return pickPanel(d, me);
  }

  function openEdit(me) {
    ed = { mode: "loading" };
    post("mine", { token: me.token }).then(function (r) {
      var usual = {}; r.usual.forEach(function (c) { usual[c] = true; });
      var changes = {}; r.changes.forEach(function (c) { changes[c.day + "|" + c.slot] = c.running; });
      ed = { mode: "edit", usual: usual, changes: changes, tab: "usual", club: !!r.club };
      rerender();
    }, function (e) { forgetMe(); ed = null; rerender(); });
  }

  function signInPanel(d) {
    var people = d.members.filter(function (m) { return m.by_hand; });
    var who = el("select", { "aria-label": "Your name" }, people.map(function (m) { return el("option", { value: m.id, text: m.name }); }));
    var pin = el("input", { type: "password", inputmode: "numeric", maxlength: "4", autocomplete: "off", "aria-label": "Your PIN" });
    return el("div", { class: "editor" }, [
      el("h4", { text: "Sign in to edit your runs" }),
      el("div", { class: "fields" }, [el("label", { class: "field" }, ["Name", who]), el("label", { class: "field" }, ["PIN", pin])]),
      ed.error ? el("p", { class: "err", text: ed.error }) : null,
      el("div", { class: "acts" }, [
        el("button", { class: "act go", type: "button", onclick: function () {
          ed.error = null;
          post("sign_in", { id: who.value, pin: pin.value }).then(function (r) { remember(r); checked = true; ed = null; reload(); }, fail);
        } }, ["Sign in"]),
        el("button", { class: "plain-btn", type: "button", onclick: function () { ed = null; rerender(); } }, ["Cancel"]),
      ]),
    ]);
  }

  function pickPanel(d, me) {
    if (ed.mode === "loading") return el("div", { class: "editor" }, [el("p", { class: "hint", text: "Loading your runs…" })]);
    var adding = ed.mode === "add";
    var thisMon = mondayOf(d.today), shownMon = ed.tab === "next" ? addDays(thisMon, 7) : thisMon;
    var tabs = adding ? null : el("div", { class: "weeks", role: "group", "aria-label": "Which runs" },
      [["usual", "Usual week"], ["this", "This week"], ["next", "Next week"]].map(function (t) {
        return el("button", { type: "button", "aria-pressed": ed.tab === t[0] ? "true" : "false", onclick: function () { ed.tab = t[0]; rerender(); } }, [t[1]]);
      }));
    var grid = el("div", { class: "pick", role: "group", "aria-label": "When you run easy" }, [el("span")]);
    for (var i = 0; i < 7; i++) {
      grid.appendChild(el("span", { class: "h mono", text: ed.tab === "usual" ? DAYS[i] : DAYS[i] + " " + addDays(shownMon, i).getDate() }));
    }
    SLOT_NAMES.forEach(function (pair) {
      grid.appendChild(el("span", { class: "l", text: pair[1] }));
      for (var i = 0; i < 7; i++) (function (i) {
        var code = KEYS[i] + "_" + pair[0], day = iso(addDays(shownMon, i)), mark = day + "|" + pair[0];
        var usualOn = !!ed.usual[code];
        var on = ed.tab === "usual" ? usualOn : (mark in ed.changes && ed.changes[mark] !== null ? ed.changes[mark] : usualOn);
        var past = ed.tab !== "usual" && day < d.today;
        grid.appendChild(el("button", {
          type: "button", "aria-pressed": on ? "true" : "false", disabled: past,
          "aria-label": DAYS[i] + " " + pair[1].toLowerCase(),
          onclick: function () {
            if (ed.tab === "usual") { if (usualOn) delete ed.usual[code]; else ed.usual[code] = true; }
            else { ed.changes[mark] = (!on === usualOn) ? null : !on; }
            rerender();
          },
        }, [on ? "easy" : ""]));
      })(i);
    });
    var name = adding ? el("input", { type: "text", maxlength: "24", autocomplete: "given-name", "aria-label": "Your first name",
      value: ed.name || "", oninput: function (e) { ed.name = e.target.value; } }) : null;
    var pin = adding ? el("input", { type: "password", inputmode: "numeric", maxlength: "4", autocomplete: "off", "aria-label": "Pick a four-digit PIN",
      value: ed.pin || "", oninput: function (e) { ed.pin = e.target.value; } }) : null;
    var save = function () {
      ed.error = null;
      var usual = Object.keys(ed.usual);
      if (adding) {
        post("add", { name: name.value, pin: pin.value, usual: usual, club: !!ed.club }).then(function (r) { remember(r); checked = true; ed = null; reload(); }, fail);
        return;
      }
      var changes = Object.keys(ed.changes).map(function (k) { var p = k.split("|"); return { day: p[0], slot: p[1], running: ed.changes[k] }; });
      post("update", { token: me.token, usual: usual, changes: changes, club: !!ed.club }).then(reload, fail);
    };
    return el("div", { class: "editor" }, [
      el("h4", { text: adding ? "Your usual easy runs" : "Your runs" }),
      el("p", { class: "hint", text: ed.tab === "usual"
        ? "Tap when you usually run easy. This repeats every week."
        : "Changes for this week only. Your usual week stays as it is." }),
      tabs, grid,
      // The club's own run, if it has one: those who go show at it, like everyone in Daash.
      d.club_run && ed.tab === "usual" ? el("button", {
        class: "club-pick", type: "button", "aria-pressed": ed.club ? "true" : "false",
        onclick: function () { ed.club = !ed.club; rerender(); },
      }, [
        el("span", { class: "box", "aria-hidden": "true" }, [ed.club ? svg('<path d="M20 6 9 17l-5-5"/>') : null]),
        el("span", { text: "I usually do the club run" + (d.club_run.day_name ? ", " + d.club_run.day_name : "")
          + (d.club_run.time ? " " + fmtTime(d.club_run.time) : "") }),
      ]) : null,
      adding ? el("div", { class: "fields" }, [
        el("label", { class: "field" }, ["First name", name]),
        el("label", { class: "field" }, ["Pick a 4-digit PIN", pin]),
      ]) : null,
      adding ? el("p", { class: "hint", text: "Your PIN lets you edit your runs from another phone. This phone remembers you." }) : null,
      ed.error ? el("p", { class: "err", text: ed.error }) : null,
      el("div", { class: "acts" }, [
        el("button", { class: "act go", type: "button", onclick: save }, [adding ? "Add my runs" : "Save"]),
        el("button", { class: "plain-btn", type: "button", onclick: function () { ed = null; rerender(); } }, ["Cancel"]),
        !adding ? el("button", { class: "plain-btn", type: "button", onclick: function () {
          if (!window.confirm("Take yourself off the crew's page? Your runs are deleted.")) return;
          post("remove", { token: me.token }).then(function () { forgetMe(); ed = null; reload(); }, fail);
        } }, ["Remove me"]) : null,
      ]),
    ]);
  }

  function weekPicker(d) {
    if (!host && !PAGE) return null;
    var t = parse(d.today), thisMon = iso(addDays(t, -((t.getDay() + 6) % 7))), nextMon = iso(addDays(parse(thisMon), 7));
    var shown = d.week.starts;
    var pick = function (starts, label) {
      return el("button", { type: "button", "aria-pressed": shown === starts ? "true" : "false", onclick: function (e) {
        if (shown === starts) return;
        e.currentTarget.parentNode.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
        getWeek({ week_of: starts }).then(show).catch(function () {
          e.currentTarget && e.currentTarget.parentNode && e.currentTarget.parentNode.querySelectorAll("button").forEach(function (b) { b.disabled = false; });
        });
      } }, [label]);
    };
    return el("div", { class: "weeks", role: "group", "aria-label": "Which week" }, [pick(thisMon, "This week"), pick(nextMon, "Next week")]);
  }
  function cap(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
  function svg(path) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("width", 14); s.setAttribute("height", 14); s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", 2);
    s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = path; return s;
  }
  // The frame may not be allowed the clipboard: then the message is shown,
  // selected, for the person to copy themselves.
  function copyText(text, status, done) {
    var fail = function () { status.textContent = text; };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { status.textContent = done; }, fail);
      else fail();
    } catch (e) { fail(); }
  }
  function copy(box, status) {
    var text = box.value;
    var shown = function () { box.hidden = false; box.focus(); box.select(); status.textContent = "Select the message and copy it."; size(); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { status.textContent = "Copied. Paste it into your group chat."; }, shown);
      } else shown();
    } catch (e) { shown(); }
  }
  // The crew's week as an image: the share page on garmin.daash.run draws it
  // from what travels after the # in the link, which browsers never send to
  // a server. Names, days, kinds and distances only.
  var SHARE_PAGE = window.__SHARE_PAGE__ || "https://garmin.daash.run/share/";
  function sharePayload(d) {
    var monday = parse(d.week.starts), u = Math.max(0, Math.min(7, daysBetween(d.week.starts, d.today)));
    var clubIdx = d.club_run ? ["mon", "tue", "wed", "thu", "fri", "sat", "sun"].indexOf(d.club_run.day) : -1;
    var club = clubIdx >= 0 ? { d: clubIdx, at: fmtTime(d.club_run.time), km: d.club_run.km || null } : null;
    return {
      v: 1, type: "crew", c: d.crew.name, w: d.week.starts, u: u, code: d.crew.code, club: club,
      m: d.members.map(function (m) { return { n: m.name, d: m.days.map(function (runs) {
        return runs.slice(0, 2).map(function (r) { return r.km ? [r.kind, Math.round(r.km * 10) / 10] : [r.kind]; }); }) }; }),
      t: d.together.map(function (t) { return { d: dow(t.date), k: t.kind, who: t.who, when: t.when || "" }; }),
    };
  }
  function fmtTime(hhmm) {
    if (!hhmm) return "";
    var h = +hhmm.split(":")[0], m = +hhmm.split(":")[1], s = h < 12 ? "am" : "pm", h12 = h % 12 || 12;
    return m ? h12 + ":" + String(m).padStart(2, "0") + s : h12 + s;
  }
  function shareImage(event) {
    var btn = event.currentTarget;
    var text = unescape(encodeURIComponent(JSON.stringify(sharePayload(data))));
    var url = SHARE_PAGE + "#" + btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    var said = function (msg) {
      var head = document.querySelector(".head"); if (!head) return;
      var note = head.querySelector(".note") || head.appendChild(el("div", { class: "note", role: "status" }));
      note.textContent = msg; requestAnimationFrame(function () { note.classList.add("on"); });
      clearTimeout(said.t); said.t = setTimeout(function () { note.classList.remove("on"); }, 4000);
    };
    btn.disabled = true;
    openLink(url).then(function () { said("The crew's week opens in the browser as an image."); },
      function () { said("This chat app didn\u2019t open the link."); }).then(function () { btn.disabled = false; });
  }
  function openLink(url) {
    if (window.openai && typeof window.openai.openExternal === "function") {
      return Promise.resolve().then(function () { return window.openai.openExternal({ href: url }); });
    }
    if (!host) return Promise.resolve(window.open(url, "_blank", "noopener"));
    return request("ui/open-link", { url: url });
  }
  // WhatsApp's own share link: it opens WhatsApp with the message typed in,
  // and the person picks the group. Nothing is sent until they press send.
  function canOpen() {
    if (!host || (window.openai && typeof window.openai.openExternal === "function")) return true;
    return !hostCaps || !!hostCaps.openLinks;
  }
  function whatsapp(text, status) {
    var url = "https://wa.me/?text=" + encodeURIComponent(text);
    openLink(url).then(function () { status.textContent = "Opening WhatsApp. Pick your group and send."; },
      function () { status.textContent = "This chat app didn\u2019t open WhatsApp. Copy the message instead."; });
  }
  function ask(text, button) {
    var note = function (msg) {
      var body = button.closest(".body") || button.parentNode; var old = body.querySelector(".sent"); if (old) old.remove();
      body.appendChild(el("div", { class: "sent", text: msg })); size();
    };
    if (!host) { note("Would ask: “" + text + "”"); return; }
    var block = { type: "text", text: text };
    request("ui/message", { role: "user", content: [block] })
      .catch(function () { return request("ui/message", { role: "user", content: block }); })
      .then(function () { note("Added to the chat"); }, function () { note("The chat did not accept that"); });
  }
  function refresh(event) {
    var btn = event.currentTarget;
    if (!host && !PAGE) return;
    btn.classList.add("spin");
    getWeek(data && data.week ? { week_of: data.week.starts } : {})
      .then(show).catch(function () {})
      .then(function () { var b = document.querySelector(".refresh"); if (b) b.classList.remove("spin"); });
  }

  // ---------------------------------------------------------------- start
  if (window.__CREW_DEMO__) { show({ structuredContent: window.__CREW_DEMO__ }); return; }
  if (PAGE) {
    document.documentElement.classList.add("page");
    if (PAGE.card && PAGE.card.crew) document.title = PAGE.card.crew.name + " · Daash crew";
    show({ structuredContent: PAGE.card });
    return;
  }
  if (!host) { document.getElementById("app").innerHTML = '<div class="empty">This view opens inside a chat that supports MCP Apps.</div>'; return; }
  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "garmin-crew", version: "1.0.0" },
    clientInfo: { name: "garmin-crew", version: "1.0.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  }).then(function (r) { hostCaps = (r && r.hostCapabilities) || null; theme((r && r.hostContext) || {}); notify("ui/notifications/initialized", {}); })
    .catch(function () { notify("ui/notifications/initialized", {}); });
})();
</script>
