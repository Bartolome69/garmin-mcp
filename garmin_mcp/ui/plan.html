<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training plan</title>
<style>
  /* The plan card get_plan draws inside the chat. Three jobs, in order: make
     the next session unmissable, show this week at a glance, and show the
     shape of the whole block with a chart that doubles as the week picker.
     The host says light or dark; the layout is fluid, so one set of rules
     stacks on a phone and goes two-column on a desktop. */
  :root {
    color-scheme: light;
    --card: #FFFFFF; --border: #E6E4DD; --text: #1F1E1B; --muted: #6B6A64; --faint: #9A9993;
    --soft: #4A4944; --line: #D9D7CF; --bar-off: #E6E4DD; --bar-past: #EEECE6; --row-line: #EEECE6;
    --btn-border: #D9D7CF; --red: #E0312A; --red-text: #C8261F; --red-soft: rgba(224,49,42,0.28);
    --bar-done: #A9A7A0; --next-bg: #FDF4F2; --next-border: #F2C9C4; --rec: #D9D7CF;
    --easy: #3F8A47; --sub: #B8651C; --long: #2F68B0; --strength: #7E57C2; --swim: #1F8A93;
    --on-red: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --card: #30302E; --border: #42423F; --text: #F4F3EE; --muted: #A6A59F; --faint: #75746F;
      --soft: #C9C8C2; --line: #4A4A46; --bar-off: #4A4A46; --bar-past: #3E3E3B; --row-line: #3C3C39;
      --btn-border: #55544F; --red: #E8322B; --red-text: #FF6A61; --red-soft: rgba(232,50,43,0.38);
      --bar-done: #8A8984; --next-bg: #3B3B38; --next-border: #6B3530; --rec: #5A5954;
      --easy: #8CC08F; --sub: #E8A15F; --long: #74A3DB; --strength: #B39DDB; --swim: #6FC2C9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --card: #30302E; --border: #42423F; --text: #F4F3EE; --muted: #A6A59F; --faint: #75746F;
    --soft: #C9C8C2; --line: #4A4A46; --bar-off: #4A4A46; --bar-past: #3E3E3B; --row-line: #3C3C39;
    --btn-border: #55544F; --red: #E8322B; --red-text: #FF6A61; --red-soft: rgba(232,50,43,0.38);
    --bar-done: #8A8984; --next-bg: #3B3B38; --next-border: #6B3530; --rec: #5A5954;
    --easy: #8CC08F; --sub: #E8A15F; --long: #74A3DB; --strength: #B39DDB; --swim: #6FC2C9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    color: var(--text);
    font: 14px/1.4 Geist, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01";
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; }

  .card { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
  .empty { padding: 28px 20px; color: var(--muted); font-size: 14px; }

  /* ---- header */
  .head { padding: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 12px 28px; border-bottom: 1px solid var(--border); }
  .head-l { flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .wordmark { font-weight: 800; font-style: italic; letter-spacing: -0.03em; color: var(--red-text); font-size: 15px; }
  .kicker { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
  .refresh { margin-left: auto; width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--btn-border);
    background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
  .refresh.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; overflow-wrap: anywhere; }
  .sub { font-size: 14px; color: var(--muted); }
  .tl { flex: 1 1 300px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tl-line { flex: 1; height: 1px; background: var(--line); min-width: 10px; }
  .tl-node { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tl-dot { width: 8px; height: 8px; border-radius: 999px; border: 1.5px solid var(--muted); flex-shrink: 0; }
  .tl-dot.cur { background: var(--red); border-color: var(--red); }
  .tl-a { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .tl-b { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  /* ---- body: a 1px gap on the border colour draws the divider either way */
  .body { display: flex; flex-wrap: wrap; gap: 1px; background: var(--border); }
  .pane { background: var(--card); min-width: 0; }
  .chart { flex: 1 1 220px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .week { flex: 999 1 340px; padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 12px; }

  .stats { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 13px; color: var(--muted); }
  .stats span { white-space: nowrap; }
  .stats strong { color: var(--text); font-weight: 600; }
  .bars { display: grid; align-items: end; }
  .bar { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: stretch; gap: 5px; min-width: 0; }
  .bar.still { cursor: default; }
  .bar:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 6px; }
  .bar-km { font-size: 11px; text-align: center; color: var(--muted); min-height: 13px; }
  .bar-km.on { color: var(--text); }
  .bar-box { position: relative; overflow: hidden; background: var(--bar-off); border-radius: 6px; }
  .bar-box.r4 { border-radius: 4px; }
  .bar-box.on { background: var(--red); }
  .bar-box.on.started { background: var(--red-soft); }
  .bar-box.past { background: var(--bar-past); }
  .bar-fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bar-done); }
  .bar-box.on .bar-fill { background: var(--red); }
  .bar-dot { position: absolute; left: 50%; bottom: 6px; margin-left: -3px; width: 6px; height: 6px; border-radius: 999px; background: var(--red); }
  .bar-box.on .bar-dot { background: var(--on-red); }
  .bar-lbl { font-size: 11px; text-align: center; white-space: nowrap; color: var(--muted); letter-spacing: -0.02em; min-height: 13px; }
  /* Week mode's labels are words, not numbers: let them take two lines. */
  .bar-lbl.wrap { white-space: normal; line-height: 1.15; min-height: 26px; font-size: 10.5px; }
  .bar-lbl.on { color: var(--text); }
  .bar-lbl.faint { color: var(--faint); }
  .phases { display: grid; }
  .phase { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .phase-line { height: 2px; border-radius: 2px; background: var(--line); }
  .phase-lbl { font-size: 10px; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap; }
  .phase.on .phase-line { background: var(--red); }
  .phase.on .phase-lbl { color: var(--text); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: auto; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .sw { width: 8px; height: 8px; border-radius: 2px; }

  .week-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .week-title { font-size: 16px; font-weight: 600; }
  .week-meta { font-weight: 400; font-size: 13px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; border: 0;
    background: var(--red); color: var(--on-red); font-size: 12px; font-weight: 500; flex-shrink: 0; }

  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .day-l { font-size: 10.5px; color: var(--faint); }
  .day-n { width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; font-weight: 600; color: var(--text); }
  .day-n.faint { color: var(--faint); }
  .day-n.next { background: var(--red); color: var(--on-red); }
  .day-m { height: 10px; display: flex; align-items: center; justify-content: center; }
  .dot { width: 6px; height: 6px; border-radius: 999px; }
  .ring { width: 7px; height: 7px; border-radius: 999px; border: 1.5px solid var(--red-text); }
  .ghost { width: 7px; height: 7px; border-radius: 999px; border: 1.5px dashed var(--faint); }

  .rows { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; padding: 11px 0; border-top: 1px solid var(--row-line); align-items: center; }
  .row-day { font-size: 11px; color: var(--muted); }
  .row-day.faint { color: var(--faint); }
  .row-mid { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .row-mid.tight { gap: 4px; }
  .row-top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .type { font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .name { font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
  .name.soft { color: var(--soft); }
  .name.muted { color: var(--muted); font-weight: 500; }
  .check { width: 16px; height: 16px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .miss { width: 16px; height: 16px; border-radius: 999px; border: 1.5px solid var(--red-text); flex-shrink: 0; }
  .meta { font-size: 12.5px; color: var(--muted); padding-left: 23px; }
  .meta.missed { color: var(--red-text); }
  .moved { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .km { font-size: 13.5px; font-weight: 500; white-space: nowrap; }
  .km.soft { color: var(--soft); }
  .km.struck { color: var(--faint); text-decoration: line-through; font-weight: 400; }
  .shape { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
  .shape span { border-radius: 2px; min-width: 2px; }
  .shape.big { height: 30px; }
  .shape.big span { border-radius: 5px; height: 30px; }

  .next { margin: 4px -8px 8px; padding: 14px; border-radius: 14px; background: var(--next-bg); border: 1px solid var(--next-border);
    display: flex; flex-direction: column; gap: 11px; }
  .next-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .next-k { font-size: 11px; letter-spacing: 0.12em; color: var(--red-text); }
  .next-when { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .next-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .next-type { font-size: 14px; font-weight: 600; }
  .next-name { font-size: 30px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; overflow-wrap: anywhere; }
  .next-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--soft); }
  .next-meta span { display: flex; align-items: center; gap: 6px; }
  .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 420px; }
  .act { height: 36px; border-radius: 999px; border: 1px solid var(--btn-border); background: transparent; font-size: 13px; font-weight: 500; padding: 0 6px; }
  .act:hover { border-color: var(--muted); }
  .sent { font-size: 12.5px; color: var(--muted); }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0 10px; border-top: 1px solid var(--row-line); }
  .foot span { font-size: 13px; color: var(--muted); }
  .foot .act { height: 34px; padding: 0 14px; flex-shrink: 0; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  /* The status box: fixed colours, nothing from the theme, so it is readable
     whatever went wrong. */
  .diag { margin: 12px; padding: 12px 14px; border-radius: 10px; background: #FFF3CD; color: #3D2C00;
    border: 1px solid #E8C96A; font: 14px/1.45 system-ui, -apple-system, Roboto, sans-serif; }
  .diag.waiting { background: #EEF2EE; color: #1F2A23; border-color: #C9D3CB; }
  .diag[hidden] { display: none; }
  .diag-tech { margin-top: 6px; font: 12px/1.4 ui-monospace, Menlo, monospace; opacity: 0.85; word-break: break-word; }
</style>
</head>
<body>
<div class="card" id="app"><div class="empty">Loading your plan&hellip;</div></div>
<div class="diag" id="diag" hidden></div>

<script>
// Watchdog. Runs before the view itself, so it can say what happened even if
// the view's script never starts: how far the conversation with the host got,
// what the host called itself, and any error. Shown only if the plan hasn't
// appeared after a few seconds, and removed the moment it does.
(function () {
  var d = window.__planDiag = { steps: [], errors: [], host: "", rendered: false, gotResult: false, initOk: false };
  function show() {
    var box = document.getElementById("diag");
    if (!box) return;
    if (d.rendered && !d.errors.length) { box.hidden = true; return; }
    var waiting = d.initOk && !d.gotResult && !d.errors.length;
    box.className = "diag" + (waiting ? " waiting" : "");
    box.textContent = "";
    var head = document.createElement("strong");
    head.textContent = waiting ? "Still fetching your plan from Garmin\u2026" : "The plan didn't load here.";
    box.appendChild(head);
    if (!waiting) {
      var hint = document.createElement("div");
      hint.textContent = "Ask Claude to show it as text instead.";
      box.appendChild(hint);
    }
    var tech = document.createElement("div");
    tech.className = "diag-tech";
    tech.textContent = d.steps.join(" > ") + (d.host ? " | app: " + d.host : "") +
      (d.errors.length ? " | error: " + d.errors.join("; ") : "");
    box.appendChild(tech);
    box.hidden = false;
  }
  d.step = function (s) { if (d.steps.length < 24) d.steps.push(s); };
  d.fail = function (msg) { d.errors.push(String(msg).slice(0, 160)); show(); };
  d.done = function () { d.rendered = true; show(); };
  window.addEventListener("error", function (e) { d.fail(e.message || "script error"); });
  window.addEventListener("unhandledrejection", function (e) {
    d.fail((e.reason && e.reason.message) || "promise rejected");
  });
  setTimeout(show, 8000);
  setTimeout(show, 30000);
  d.step("page");
})();
</script>
<script>
(function () {
  "use strict";
  var D = window.__planDiag || { step: function () {}, fail: function () {}, done: function () {} };

  // ---------------------------------------------------------------- bridge
  // The host speaks JSON-RPC over postMessage. Only the handful of messages
  // this view needs are implemented, so there is no SDK to load.
  var host = window.parent !== window ? window.parent : null;
  var nextId = 1, pending = {}, hostContext = {};

  function send(msg) { if (host) host.postMessage(Object.assign({ jsonrpc: "2.0" }, msg), "*"); }
  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      send({ id: id, method: method, params: params || {} });
      setTimeout(function () { if (pending[id]) { delete pending[id]; reject(new Error("timeout")); } }, 20000);
    });
  }
  function notify(method, params) { send({ method: method, params: params || {} }); }

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (data && data.jsonrpc !== "2.0") { D.step("other msg " + String(data.type || typeof data).slice(0, 40)); return; }
    if (!data) return;
    if (data.id != null && !data.method && pending[data.id]) {
      var p = pending[data.id]; delete pending[data.id];
      data.error ? p.reject(new Error(data.error.message || "error")) : p.resolve(data.result);
      return;
    }
    switch (data.method) {
      case "ui/notifications/tool-input": D.step("input"); break;
      case "ui/notifications/tool-result": D.step("result"); D.gotResult = true; onResult(data.params); break;
      case "ui/notifications/host-context-changed": applyContext(data.params || {}); break;
      case "ui/notifications/tool-cancelled": D.step("cancelled"); fail("The plan could not be loaded."); D.done(); break;
      case "ui/resource-teardown": case "ping":
        if (data.id != null) send({ id: data.id, result: {} });
        break;
      default:
        if (data.method) D.step("got " + String(data.method).slice(0, 60));
    }
  });

  function applyContext(ctx) {
    Object.assign(hostContext, ctx);
    if (ctx.theme) document.documentElement.setAttribute("data-theme", ctx.theme);
    // Nothing is fetched from outside the frame; the host's own font faces
    // are the only way Geist arrives, system fonts otherwise.
    var fonts = ctx.styles && ctx.styles.css && ctx.styles.css.fonts;
    if (fonts && !document.getElementById("host-fonts")) {
      var st = document.createElement("style"); st.id = "host-fonts"; st.textContent = fonts; document.head.appendChild(st);
    }
  }

  function onResult(result) {
    try { showResult(result); } catch (e) { D.fail("drawing: " + (e && e.message)); }
  }
  function showResult(result) {
    if (!result) { D.fail("empty result"); return; }
    var plan = result.structuredContent;
    if (!plan && result.content) {
      for (var i = 0; i < result.content.length; i++) {
        var c = result.content[i];
        if (c.type === "text") { try { plan = JSON.parse(c.text); break; } catch (e) {} }
      }
    }
    raw = plan;
    state.sel = null;
    render(isProgress(plan) ? fromProgress(plan) : plan);
    D.done();
  }

  // ---------------------------------------------------------------- helpers
  var DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var LETTERS = ["M", "T", "W", "T", "F", "S", "S"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function parse(s) { var p = String(s).slice(0, 10).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function between(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
  function dow(s) { return (parse(s).getDay() + 6) % 7; }
  function short(s) { var d = parse(s); return d.getDate() + " " + MONTHS[d.getMonth()]; }
  function range(a, b) {
    var x = parse(a), y = parse(b);
    if (x.getMonth() === y.getMonth()) return x.getDate() + "\u2013" + y.getDate() + " " + MONTHS[y.getMonth()];
    return short(a) + " \u2013 " + short(b);
  }
  function fmtKm(n) { if (n == null) return ""; var r = Math.round(n * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); }
  function sum(list, f) { return list.reduce(function (t, x) { return t + (f(x) || 0); }, 0); }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k === "onclick") node.addEventListener("click", attrs[k]);
      else if (k === "style") node.setAttribute("style", attrs[k]);
      else if (attrs[k] != null && attrs[k] !== false) node.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    });
    (children || []).forEach(function (c) { if (c == null || c === false) return; node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return node;
  }
  function svg(path, size, stroke, width) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "none"); s.setAttribute("stroke", stroke || "currentColor");
    s.setAttribute("stroke-width", width || 2); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    s.setAttribute("aria-hidden", "true"); s.innerHTML = path; return s;
  }
  var ICON = {
    refresh: '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
    back: '<path d="m15 18-6-6 6-6"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
    gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
    watch: '<circle cx="12" cy="12" r="6"/><polyline points="12 10 12 12 13 13"/><path d="m16.13 7.66-.81-4.05a2 2 0 0 0-2-1.61h-2.68a2 2 0 0 0-2 1.61l-.78 4.05"/><path d="m7.88 16.36.8 4a2 2 0 0 0 2 1.61h2.72a2 2 0 0 0 2-1.61l.81-4.05"/>',
    arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  };

  // Session types: colour and the short label beside a title. Easy, sub-T,
  // long and race are the run types; the rest are other sports.

      el("div", { class: "row-mid" }, [
        el("div", { class: "row-top" }, [el("span", { class: "type", style: "color:" + t.v, text: t.l }), el("span", { class: "name", text: cleanTitle(s) })]),
        shapeBar(s, false),
      ]),
      el("span", { class: "km", text: s.planned_km ? fmtKm(s.planned_km) + " km" : "" }),
    ]);
  }
  function movedLine(s, w) {
    var sameWeek = s.date >= w.starts && s.date < iso(addDays(parse(w.starts), 7));
    return "Moved from " + DAYS[dow(s.date)] + " " + parse(s.date).getDate() + (sameWeek ? "" : " " + MONTHS[parse(s.date).getMonth()]);
  }

  // The workout as a bar: easy parts low, work reps high, recoveries lower
  // still, each as wide as its distance. A run without steps is one bar.
  function shapeBar(s, big) {
    var t = typeOf(s), segs = s.shape && s.shape.length ? s.shape : [{ k: s.type === "race" ? "work" : "easy", km: s.planned_km || 1 }];
    var scale = big ? 1 : 0.7;
    var easyColour = s.type === "long" ? TYPES.long.v : s.type === "easy" || !TYPES[s.type] || s.type === "sub" ? TYPES.easy.v : t.v;
    return el("div", { class: "shape" + (big ? " big" : ""), "aria-hidden": "true" }, segs.map(function (g) {
      var h = g.k === "work" ? 26 : g.k === "rec" ? 6 : 12;
      var c = g.k === "work" ? (s.type === "race" ? TYPES.race.v : TYPES.sub.v) : g.k === "rec" ? "var(--rec)" : easyColour;
      return el("span", { style: "flex:" + Math.max(g.km, 0.1) + " 1 0;height:" + (big ? 30 : Math.round(h * scale)) + "px;background:" + c });
    }));
  }

  function nextCard(s, m) {
    var t = typeOf(s), d = parse(s.date);
    var diff = between(m.today, s.date);
    var when = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff > 1 ? "In " + diff + " days" : "Overdue";
    var meta = [];
    if (s.target) meta.push(el("span", {}, [svg(/bpm/.test(s.target) ? ICON.heart : ICON.gauge, 13, "var(--red-text)"), s.target]));
    meta.push(el("span", {}, [svg(ICON.watch, 13), "Ready to sync"]));
    var name = cleanTitle(s), when2 = DAYS[dow(s.date)] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
    var card = el("div", { class: "next" }, [
      el("div", { class: "next-top" }, [
        el("span", { class: "next-k mono", text: "NEXT \u00b7 " + when2.toUpperCase() }),
        el("span", { class: "next-when", text: when }),
      ]),
      el("div", { class: "next-title" }, [el("span", { class: "next-type", style: "color:" + t.v, text: t.l }), el("span", { class: "next-name", text: name })]),
      shapeBar(s, true),
      el("div", { class: "next-meta" }, meta),
      el("div", { class: "acts" }, [
        el("button", { class: "act", onclick: function (e) { ask("Move my " + name + " on " + when2 + " to another day that works with the rest of the week.", e.currentTarget); } }, ["Move"]),
        el("button", { class: "act", onclick: function (e) { ask("Make my " + name + " on " + when2 + " easier. I\u2019m not fresh enough for it as planned.", e.currentTarget); } }, ["Easier"]),
        el("button", { class: "act", onclick: function (e) { ask("Why is " + name + " on " + when2 + " in my plan this week, and what should it feel like?", e.currentTarget); } }, ["Ask why"]),
      ]),
    ]);
    return card;
  }

  // ---------------------------------------------------------------- actions
  function ask(text, button) {
    if (!host) { flash(button, "Would ask: \u201c" + text + "\u201d"); return; }
    var block = { type: "text", text: text };
    request("ui/message", { role: "user", content: [block] })
      .catch(function () { return request("ui/message", { role: "user", content: block }); })
      .then(function () { flash(button, "Added to the chat"); })
      .catch(function () { flash(button, "The chat did not accept that"); });
  }
  function flash(button, msg) {
    var box = button.closest(".next, .foot"); if (!box) return;
    var old = box.querySelector(".sent"); if (old) old.remove();
    box.appendChild(el("div", { class: "sent", text: msg }));
  }
  function refresh(event) {
    var btn = event.currentTarget;
    if (!host) return;
    btn.classList.add("spin");
    request("tools/call", { name: "get_plan", arguments: raw && raw.label ? { label: raw.label } : {} })
      .then(function (r) { onResult(r); })
      .catch(function () {})
      .then(function () { var b = document.querySelector(".refresh"); if (b) b.classList.remove("spin"); });
  }

  // ---------------------------------------------------------------- progress
  // get_progress answers "how's my plan going" too, with the same sessions in
  // three lists. Drawn as the calendar version of the plan.
  function isProgress(p) {
    return !!(p && !p.error && Array.isArray(p.upcoming) && Array.isArray(p.sessions) && p.weeks && p.weeks.length && "week_of" in p.weeks[0]);
  }
  function fromProgress(p) {
    var today = iso(new Date());
    var earliest = p.weeks[0].week_of;
    var horizon = iso(addDays(mondayOf(new Date()), 28));
    var rows = [];
    (p.sessions || []).forEach(function (r) {
      rows.push({ date: r.date, name: r.name, sport: r.sport, status: r.done_on && r.done_on !== r.date ? "done, moved" : "done",
        done_on: r.done_on !== r.date ? r.done_on : undefined, activity_id: r.activity_id, actual_km: r.actual_km });
    });
    (p.missed || []).forEach(function (r) { rows.push({ date: r.date, name: r.name, sport: r.sport, status: r.date === today ? "today" : "missed" }); });
    (p.upcoming || []).forEach(function (r) { rows.push({ date: r.date, name: r.name, sport: r.sport, status: r.date === today ? "today" : "ahead" }); });
    rows = rows.filter(function (r) { return r.date >= earliest && r.date < horizon; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    if (!rows.length) return { error: "Nothing is scheduled on the Garmin calendar in the weeks around this one." };
    rows.forEach(function (r) { r.day = DAYS[dow(r.date)]; r.type = r.sport === "run" ? undefined : r.sport; });
    var weeks = {}, order = [];
    rows.forEach(function (r) {
      var start = iso(mondayOf(parse(r.date)));
      if (!weeks[start]) { weeks[start] = { starts: start, sessions: [], current: start === iso(mondayOf(new Date())) }; order.push(start); }
      weeks[start].sessions.push(r);
    });
    var list = order.map(function (start, i) { var w = weeks[start]; w.week = i + 1; return w; });
    var ahead = rows.filter(function (r) { return r.status === "today" || r.status === "ahead"; });
    return { source: "calendar", starts: rows[0].date, ends: rows[rows.length - 1].date, weeks: list, next_session: ahead[0] || null };
  }

  // ---------------------------------------------------------------- start
  if (window.__PLAN_DEMO__) { raw = window.__PLAN_DEMO__; render(raw); D.done(); return; }
  if (!host) { D.step("no host frame"); fail("This view opens inside a chat that supports MCP Apps."); D.done(); return; }
  D.step("init sent");
  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "garmin-plan", version: "2.0.0" },
    clientInfo: { name: "garmin-plan", version: "2.0.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  }).then(function (result) {
    var info = (result && (result.hostInfo || result.serverInfo)) || {};
    var ctx = (result && result.hostContext) || {};
    D.initOk = true;
    D.host = [info.name, info.version, ctx.platform, ctx.theme, ctx.displayMode].filter(Boolean).join(" ") || "unnamed";
    D.step("init ok");
    applyContext(ctx);
    notify("ui/notifications/initialized", {});
    D.step("ready sent");
  }).catch(function (e) {
    D.step("init failed: " + (e && e.message));
    notify("ui/notifications/initialized", {});
  });
})();
</script>
</body>
</html>
