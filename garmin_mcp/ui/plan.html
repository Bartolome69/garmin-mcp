<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training plan</title>
<style>
  /* Plan view for the get_plan tool, rendered inside the chat by hosts that
     support MCP Apps. Colours and type come from the host's theme variables
     where it passes them, so the view looks like part of Claude or ChatGPT;
     the fallbacks are the site's own palette. Status and session type are the
     only two things colour encodes. */
  :root {
    color-scheme: light;
    --bg: var(--color-background-primary, #F4F6F3);
    --card: var(--color-background-secondary, #FFFFFF);
    --sunk: var(--color-background-tertiary, #E8EDE8);
    --ink: var(--color-text-primary, #17211B);
    --muted: var(--color-text-secondary, #55655B);
    --faint: var(--color-text-tertiary, #7A897F);
    --line: var(--color-border-secondary, #D3DBD3);
    --done: var(--color-text-success, #2F6B4F);
    --done-bg: var(--color-background-success, #E3EFE7);
    --miss: var(--color-text-danger, #B4492A);
    --miss-bg: var(--color-background-danger, #F6E6DE);
    --ring: var(--brand);
    /* Daash: its red for accents and running, its navy for riding. */
    --brand: #E63023;
    --run: #E63023;
    --ride: #2B3A4E;
    --easy: #6E9C82;
    --long: #3F6E9E;
    --quality: #C2612F;
    --race: #B08A1E;
    --strength: #7C6BA6;
    --radius: var(--border-radius-lg, 12px);
    --radius-sm: var(--border-radius-sm, 6px);
    --sans: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: var(--color-background-primary, #0E1512);
      --card: var(--color-background-secondary, #16201A);
      --sunk: var(--color-background-tertiary, #1D2922);
      --ink: var(--color-text-primary, #E3ECE5);
      --muted: var(--color-text-secondary, #9AAC9F);
      --faint: var(--color-text-tertiary, #6F8176);
      --line: var(--color-border-secondary, #27352C);
      --done: var(--color-text-success, #63BC8E);
      --done-bg: var(--color-background-success, #17301F);
      --miss: var(--color-text-danger, #E08A5A);
      --miss-bg: var(--color-background-danger, #33201A);
      --ring: var(--brand);
      --brand: #FF5A4E; --run: #FF5A4E; --ride: #9DB2CF;
      --easy: #7FB597; --long: #6E9CCB; --quality: #E08A5A; --race: #D4B04A; --strength: #A694D1;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: var(--color-background-primary, #0E1512);
    --card: var(--color-background-secondary, #16201A);
    --sunk: var(--color-background-tertiary, #1D2922);
    --ink: var(--color-text-primary, #E3ECE5);
    --muted: var(--color-text-secondary, #9AAC9F);
    --faint: var(--color-text-tertiary, #6F8176);
    --line: var(--color-border-secondary, #27352C);
    --done: var(--color-text-success, #63BC8E);
    --done-bg: var(--color-background-success, #17301F);
    --miss: var(--color-text-danger, #E08A5A);
    --miss-bg: var(--color-background-danger, #33201A);
    --ring: var(--brand);
    --brand: #FF5A4E; --run: #FF5A4E; --ride: #9DB2CF;
    --easy: #7FB597; --long: #6E9CCB; --quality: #E08A5A; --race: #D4B04A; --strength: #A694D1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* If the host's theme variables fail to apply, the page still has a
     background and a readable text colour of its own. */
  html { background: Canvas; color: CanvasText; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .app { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin: 0 auto; }
  button { font: inherit; color: inherit; }
  button:focus-visible, .cell:focus-visible, .week-head:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .mono { font-family: var(--mono); }

  /* ---- Header ---- */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); display: flex; gap: 8px; align-items: center;
  }
  .upcoming { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .code { background: var(--sunk); color: var(--ink); padding: 2px 7px; border-radius: 999px; letter-spacing: 0.08em; }
  h1 { margin: 4px 0 0; font-family: "Inter Tight", var(--sans); font-size: 22px; line-height: 1.15; font-weight: 700;
    letter-spacing: -0.025em; text-wrap: balance; }
  .wordmark { font-family: "Inter Tight", var(--sans); font-style: italic; font-weight: 900; font-size: 13px;
    letter-spacing: -0.01em; text-transform: none; color: var(--brand); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .icon-btn {
    flex: none; width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; display: grid; place-items: center; color: var(--muted);
  }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn svg { width: 16px; height: 16px; }
  .spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Progress ---- */
  .progress { display: flex; flex-direction: column; gap: 6px; }
  .bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--sunk); }
  .bar i { display: block; height: 100%; }
  .bar .d { background: var(--done); }
  .bar .m { background: var(--miss); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend b { color: var(--ink); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  /* ---- Next session ---- */
  /* ---- Training log ---- */
  .trend { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; align-items: end; height: 132px; padding: 4px 2px 0; }
  .tcol { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
  .tval { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tbar-wrap { flex: 1; width: 100%; max-width: 44px; display: flex; align-items: flex-end; }
  .tbar { display: block; width: 100%; border-radius: 6px 6px 3px 3px; background: var(--sunk); }
  .tstack { display: flex; flex-direction: column; width: 100%; border-radius: 6px 6px 3px 3px; overflow: hidden; opacity: 0.72; }
  .tcol.current .tstack { opacity: 1; }
  .tstack i { display: block; }
  .ride-c { background: var(--ride); }
  .run-c { background: var(--run); }
  .other-c { background: var(--faint); }
  .tlab { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .tcol.current .tlab { color: var(--ink); font-weight: 600; }
  .highlights { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .hl { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .hl-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  .hl-val { font-size: 18px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .hl-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .loglist { display: none; padding: 0 8px 10px; flex-direction: column; gap: 4px; }
  .week.open .loglist { display: flex; }
  .logrow { position: relative; display: grid; grid-template-columns: 38px 1fr auto; gap: 8px; align-items: baseline;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 10px 9px 12px; font-size: 13.5px; }
  .logrow::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--t, var(--easy)); border-radius: 3px 0 0 3px; }
  .lday { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  .lname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .lval { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .logrow.empty-week { display: block; color: var(--faint); font-style: italic; }
  .logrow.empty-week::before { display: none; }
  .next {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; display: grid; grid-template-columns: 4px 1fr; gap: 12px;
  }
  .next > .sent { grid-column: 2; margin-top: -4px; }
  .stripe { border-radius: 999px; background: var(--easy); }
  .next-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .next-name { font-size: 17px; font-weight: 650; margin-top: 2px; }
  .next-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .act {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
    padding: 7px 13px; font-size: 13px; font-weight: 550; cursor: pointer;
  }
  .act:hover { background: var(--sunk); }
  .act.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .act.primary:hover { opacity: 0.88; }
  .sent { font-size: 12.5px; color: var(--done); margin-top: 8px; }

  /* ---- Countdown, phase and the shape of the block ---- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--sunk); color: var(--ink);
    font-variant-numeric: tabular-nums; }
  .chip.brand { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); }
  .block { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 10px; }
  .block-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: var(--muted); }
  .block-head b { color: var(--ink); font-weight: 600; }
  .bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; align-items: end; height: 64px; margin-top: 10px; }
  .bcol { position: relative; height: 100%; display: flex; align-items: flex-end; }
  .bplan { position: relative; width: 100%; border-radius: 3px 3px 2px 2px; overflow: hidden;
    background: color-mix(in srgb, var(--faint) 30%, var(--sunk)); }
  .bdone { position: absolute; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--brand) 60%, var(--sunk)); }
  .bcol.current .bplan { box-shadow: 0 0 0 1.5px var(--brand); }
  .bcol.current .bdone { background: var(--brand); }
  .bcol.taper .bplan { background: color-mix(in srgb, var(--faint) 16%, var(--sunk)); }
  .blabels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); margin-top: 4px; font-family: var(--mono); letter-spacing: 0.04em; }

  /* ---- The next session's steps ---- */
  .steps { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .step { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 7px 10px; font-size: 13px; }
  .step .what b { font-weight: 600; }
  .step .what span { color: var(--muted); }
  .step .tgt { color: var(--brand); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rep { border-left: 2px solid var(--brand); padding-left: 8px; display: flex; flex-direction: column; gap: 4px; }
  .rep-head { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brand); font-weight: 600; }

  /* ---- Weeks ---- */
  .weeks { display: flex; flex-direction: column; gap: 8px; }
  .week { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .week.current { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring) inset; }
  .week-head {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: none; border: 0; cursor: pointer; text-align: left;
  }
  .wk { font-weight: 650; font-size: 14px; min-width: 64px; }
  .wk small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .pips { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .pip { width: 10px; height: 10px; border-radius: 3px; background: var(--sunk); border: 1px solid color-mix(in srgb, var(--faint) 50%, var(--line)); }
  .pip.done { background: var(--done); border-color: var(--done); }
  .pip.missed { background: var(--miss); border-color: var(--miss); }
  .pip.today { border: 2px solid var(--ring); background: transparent; }
  .count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; gap: 10px; }
  .count .km { color: var(--ink); font-weight: 600; }
  .chev { color: var(--faint); transition: transform 0.15s ease; flex: none; }
  .week.open .chev { transform: rotate(90deg); }

  .grid { display: none; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 0 8px 10px; }
  .week.open .grid { display: grid; }
  .day { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .dname { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); text-align: center; }
  .dname.is-today { color: var(--ring); font-weight: 600; }
  .cell {
    position: relative; border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--bg); padding: 6px 5px 6px 8px; min-height: 58px; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px; text-align: left; overflow: hidden;
  }
  .cell::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--t, var(--easy)); }
  .cell .n { font-size: 11.5px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
  .cell .s { font-size: 10.5px; color: var(--muted); }
  .cell.done { background: var(--done-bg); border-color: transparent; }
  .cell.done .s { color: var(--done); font-weight: 600; }
  .cell.missed { background: var(--miss-bg); border-color: transparent; }
  .cell.missed .s { color: var(--miss); font-weight: 600; }
  .cell.missed .n { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--miss) 60%, transparent); }
  .cell.today { border: 2px solid var(--ring); }
  .cell[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
  .cell.extra { background: transparent; border: 1px dashed var(--line); cursor: default; }
  .cell.extra::before { background: var(--faint); opacity: 0.5; }
  .cell.extra .n { font-weight: 500; color: var(--muted); }
  .rest { min-height: 58px; border-radius: var(--radius-sm); border: 1px dashed var(--line); opacity: 0.55; }

  /* ---- Detail ---- */
  .detail { margin: 0 8px 10px; padding: 12px; background: var(--bg); border-radius: var(--radius-sm); border: 1px solid var(--line); }
  .detail h3 { margin: 0; font-size: 15px; }
  .detail p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .foot { color: var(--faint); font-size: 12px; text-align: center; padding: 2px 0 4px; }
  .empty { padding: 28px 12px; text-align: center; color: var(--muted); }

  /* A phone has no room for seven columns: the week becomes a list of the
     days that have something on them. */
  @media (max-width: 520px) {
    .app { padding: 12px; }
    .week.open .grid { display: flex; flex-direction: column; gap: 4px; padding: 0 8px 10px; }
    .day { flex-direction: row; align-items: stretch; gap: 8px; }
    .day:has(> .rest) { display: none; }
    .dname { width: 34px; flex: none; text-align: left; align-self: center; }
    .cell { flex: 1; min-height: 0; flex-direction: row; align-items: baseline; justify-content: space-between; gap: 8px; padding: 9px 10px 9px 12px; }
    .cell .n { font-size: 13.5px; overflow-wrap: normal; }
    .cell .s { font-size: 12px; white-space: nowrap; }
    .count .sessions { display: none; }
  }
  /* The status box: fixed colours, nothing from the theme, so it is readable
     whatever went wrong. */
  .diag { margin: 12px; padding: 12px 14px; border-radius: 10px; background: #FFF3CD; color: #3D2C00;
    border: 1px solid #E8C96A; font: 14px/1.45 system-ui, -apple-system, Roboto, sans-serif; }
  .diag.waiting { background: #EEF2EE; color: #1F2A23; border-color: #C9D3CB; }
  .diag[hidden] { display: none; }
  .diag-tech { margin-top: 6px; font: 12px/1.4 ui-monospace, Menlo, monospace; opacity: 0.85; word-break: break-word; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"><div class="empty">Loading your plan&hellip;</div></div>
<div class="diag" id="diag" hidden></div>

<script>
// Watchdog. Runs before the view itself, so it can say what happened even if
// the view's script never starts: how far the conversation with the host got,
// what the host called itself, and any error. Shown only if the plan hasn't
// appeared after a few seconds, and removed the moment it does.
(function () {
  var d = window.__planDiag = { steps: [], errors: [], host: "", rendered: false, gotResult: false, initOk: false };
  function show() {
    var box = document.getElementById("diag");
    if (!box) return;
    if (d.rendered && !d.errors.length) { box.hidden = true; return; }
    var waiting = d.initOk && !d.gotResult && !d.errors.length;
    box.className = "diag" + (waiting ? " waiting" : "");
    box.textContent = "";
    var head = document.createElement("strong");
    head.textContent = waiting ? "Still fetching your plan from Garmin\u2026" : "The plan didn't load here.";
    box.appendChild(head);
    if (!waiting) {
      var hint = document.createElement("div");
      hint.textContent = "Ask Claude to show it as text instead.";
      box.appendChild(hint);
    }
    var tech = document.createElement("div");
    tech.className = "diag-tech";
    tech.textContent = d.steps.join(" > ") + (d.host ? " | app: " + d.host : "") +
      (d.errors.length ? " | error: " + d.errors.join("; ") : "");
    box.appendChild(tech);
    box.hidden = false;
  }
  d.step = function (s) { if (d.steps.length < 24) d.steps.push(s); };
  d.fail = function (msg) { d.errors.push(String(msg).slice(0, 160)); show(); };
  d.done = function () { d.rendered = true; show(); };
  window.addEventListener("error", function (e) { d.fail(e.message || "script error"); });
  window.addEventListener("unhandledrejection", function (e) {
    d.fail((e.reason && e.reason.message) || "promise rejected");
  });
  setTimeout(show, 8000);
  setTimeout(show, 30000);
  d.step("page");
})();
</script>
<script>
(function () {
  "use strict";
  var D = window.__planDiag || { step: function () {}, fail: function () {}, done: function () {} };

  // ---------------------------------------------------------------- bridge
  // The host speaks JSON-RPC over postMessage. Only the handful of messages
  // this view needs are implemented, so there is no SDK to load.
  var host = window.parent !== window ? window.parent : null;
  var nextId = 1, pending = {}, hostContext = {};

  function send(msg) { if (host) host.postMessage(Object.assign({ jsonrpc: "2.0" }, msg), "*"); }
  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      send({ id: id, method: method, params: params || {} });
      setTimeout(function () { if (pending[id]) { delete pending[id]; reject(new Error("timeout")); } }, 20000);
    });
  }
  function notify(method, params) { send({ method: method, params: params || {} }); }

  window.addEventListener("message", function (event) {
    var data = event.data;
    // Anything that isn't JSON-RPC is noted, not ignored silently: a host on
    // an older version of the protocol speaks a different shape.
    if (data && data.jsonrpc !== "2.0") { D.step("other msg " + String(data.type || typeof data).slice(0, 40)); return; }
    if (!data) return;
    if (data.id != null && !data.method && pending[data.id]) {
      var p = pending[data.id]; delete pending[data.id];
      data.error ? p.reject(new Error(data.error.message || "error")) : p.resolve(data.result);
      return;
    }
    switch (data.method) {
      case "ui/notifications/tool-input": D.step("input"); break;
      case "ui/notifications/tool-result": D.step("result"); D.gotResult = true; onResult(data.params); break;
      case "ui/notifications/host-context-changed": applyContext(data.params || {}); break;
      case "ui/notifications/tool-cancelled": D.step("cancelled"); render(null, "The plan could not be loaded."); D.done(); break;
      case "ui/resource-teardown": case "ping":
        if (data.id != null) send({ id: data.id, result: {} });
        break;
      default:
        if (data.method) D.step("got " + String(data.method).slice(0, 60));
    }
  });

  function applyContext(ctx) {
    Object.assign(hostContext, ctx);
    if (ctx.theme) document.documentElement.setAttribute("data-theme", ctx.theme);
    var vars = ctx.styles && ctx.styles.variables;
    if (vars) Object.keys(vars).forEach(function (k) { if (vars[k]) document.documentElement.style.setProperty(k, vars[k]); });
    var fonts = ctx.styles && ctx.styles.css && ctx.styles.css.fonts;
    if (fonts && !document.getElementById("host-fonts")) {
      var s = document.createElement("style"); s.id = "host-fonts"; s.textContent = fonts; document.head.appendChild(s);
    }

    // The block
    if (!fromCalendar) { var chart = blockChart(plan); if (chart) app.appendChild(chart); }

    // Next session
    var nx = plan.next_session;
    if (nx) {
      var k = kind(nx.name, nx.sport);
      var label = nx.date === today ? "Today" : nx.date === iso(addDays(new Date(), 1)) ? "Tomorrow" : long(nx.date);
      var missedNote = plan.review && plan.review.missed_last_7_days ? plan.review.missed_last_7_days.length : 0;
      app.appendChild(el("div", { class: "next" }, [
        el("div", { class: "stripe", style: "background:" + k.c }),
        el("div", {}, [
          el("div", { class: "next-label", text: "Next · " + label }),
          el("div", { class: "next-name", text: nx.name }),
          el("div", { class: "next-meta", text: k.label + (nx.planned_km ? " · " + fmtKm(nx.planned_km) + " km" : "") + (missedNote ? " · " + missedNote + " missed this past week" : "") }),
          nx.steps && nx.steps.length ? stepList(nx.steps) : null,
          actionsFor(nx, plan.label || (plan.current_plan && plan.current_plan.label)),
        ]),
      ]));
    }

    // Weeks
    var weeks = el("div", { class: "weeks" });
    plan.weeks.forEach(function (w) {
      var isOpen = state.open[w.week] != null ? state.open[w.week] : !!w.current;
      var box = el("div", { class: "week" + (w.current ? " current" : "") + (isOpen ? " open" : "") });
      var pips = el("div", { class: "pips", "aria-hidden": "true" },
        w.sessions.map(function (s) { return el("span", { class: "pip " + cls(s) }); }));
      var head = el("button", { class: "week-head", "aria-expanded": String(isOpen), onclick: function () {
        state.open[w.week] = !box.classList.contains("open"); render(state.plan); } }, [
        el("div", { class: "wk" }, fromCalendar
          ? [weekName(w), el("small", { text: short(w.starts) })]
          : ["Week " + w.week, el("small", { text: short(w.starts) })]),
        pips,
        el("span", { class: "count" }, [
          w.run_km != null ? el("span", { class: "km", text: kmText(w) }) : null,
          el("span", { class: w.run_km != null ? "sessions" : "", text: (w.done || 0) + "/" + w.planned }),
        ]),
        svg('<path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>', "chev"),
      ]);
      box.appendChild(head);

      var grid = el("div", { class: "grid" });
      var monday = parse(w.starts);
      for (var i = 0; i < 7; i++) {
        var d = iso(addDays(monday, i));
        var todays = w.sessions.filter(function (s) { return s.date === d; });
        var extras = (w.extra || []).filter(function (x) { return x.date === d; });
        var col = el("div", { class: "day" }, [el("div", { class: "dname" + (d === today ? " is-today" : ""), text: DAYS[i] })]);
        if (!todays.length && !extras.length) col.appendChild(el("div", { class: "rest", "aria-label": "Rest" }));
        todays.forEach(function (s) {
          var k2 = kind(s.name, s.sport), key = s.schedule_id || (s.date + s.name);
          col.appendChild(el("button", {
            class: "cell " + cls(s), style: "--t:" + k2.c, "aria-pressed": String(state.selected === key),
            "aria-label": s.name + ", " + long(s.date) + ", " + (statusText(s) || "ahead"),
            onclick: function () { state.selected = state.selected === key ? null : key; state.open[w.week] = true; render(state.plan); },
          }, [el("span", { class: "n", text: s.name }),
              el("span", { class: "s", text: statusText(s) || (s.planned_km ? fmtKm(s.planned_km) + " km" : "") })]));
        });
        // Runs nobody planned still count towards the week, so they are drawn,
        // quietly, in the day they happened.
        extras.forEach(function (x) {
          col.appendChild(el("div", { class: "cell extra", "aria-label": "Unplanned: " + x.name + (x.actual_km ? ", " + x.actual_km + " km" : "") }, [
            el("span", { class: "n", text: x.name }),
            el("span", { class: "s", text: x.actual_km ? fmtKm(x.actual_km) + " km, extra" : "Extra" }),
          ]));
        });
        grid.appendChild(col);
      }
      box.appendChild(grid);

      var sel = w.sessions.filter(function (s) { return (s.schedule_id || (s.date + s.name)) === state.selected; })[0];
      if (sel && isOpen) {
        var lines = [kind(sel.name, sel.sport).label + " · " + long(sel.date)];
        if (sel.status.indexOf("done") === 0) {
          var bits = [];
          if (sel.done_on) bits.push("run on " + long(sel.done_on));
          if (sel.actual_km) bits.push(sel.actual_km + " km");
          if (sel.actual) bits.push(sel.actual);
          if (bits.length) lines.push("Done: " + bits.join(", "));
        } else if (sel.status === "missed") lines.push("No run found within a day of it.");
        box.appendChild(el("div", { class: "detail" }, [
          el("h3", { text: sel.name }),
        ].concat(lines.map(function (t) { return el("p", { text: t }); })).concat([actionsFor(sel, plan.label || (plan.current_plan && plan.current_plan.label))])));
      }
      weeks.appendChild(box);
    });
    app.appendChild(weeks);
    app.appendChild(el("div", { class: "foot", text: "Tap a session to move it or ask about it. Done means run within a day of its date." }));
  }

  function svg(inner, extra) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("width", "16"); s.setAttribute("height", "16");
    s.setAttribute("aria-hidden", "true"); if (extra) s.setAttribute("class", extra);
    s.innerHTML = inner; return s;
  }

  // ---------------------------------------------------------------- log
  // Nothing scheduled: what was done over the last few weeks, and the way to a
  // plan. Led by running or riding, whichever took more of the time. A week
  // with none stays in the trend as a gap.
  function renderLog(plan) {
    state.plan = plan;
    var app = document.getElementById("app");
    app.textContent = "";
    app.appendChild(el("div", { class: "top" }, [
      el("div", {}, [
        el("div", { class: "kicker" }, [el("span", { class: "wordmark", text: "Daash" }), "Your training log"]),
        el("h1", { text: "Last " + plan.weeks.length + " weeks" }),
        el("div", { class: "sub", text: "Nothing scheduled on Garmin · " + short(plan.starts) + " to " + short(plan.ends) }),
      ]),
      el("button", { class: "icon-btn", title: "Refresh", "aria-label": "Refresh", onclick: refresh },
        [svg('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>')]),
    ]));

    // One summary of everything: each sport done gets its own totals and
    // highlights. With both, the weeks are drawn in time, split by sport,
    // because kilometres don't add across a bike and two feet.
    var run = sportStats(plan, "run"), ride = sportStats(plan, "ride");
    var S = [];
    if (run.count) S.push({ key: "run", st: run, cls: "run-c", did: " km run", one: " run", many: " runs", label: "run" });
    if (ride.count) S.push({ key: "ride", st: ride, cls: "ride-c", did: " km ridden", one: " ride", many: " rides", label: "ride" });
    var both = S.length > 1;
    var weeksN = plan.weeks.length || 1;
    var allSecs = function (w) { return w.sessions.reduce(function (t, r) { return t + (r.secs || 0); }, 0); };
    var weekKm = function (w, sport) {
      return Math.round(w.sessions.reduce(function (t, r) { return t + (r.sport === sport ? (r.actual_km || 0) : 0); }, 0) * 10) / 10; };
    var others = plan.weeks.reduce(function (t, w) {
      return t + w.sessions.filter(function (r) { return r.sport !== "run" && r.sport !== "ride"; }).length; }, 0);
    var hl = [];

    var legend = S.map(function (x) {
      return el("span", {}, [el("i", { class: "dot " + x.cls }), el("b", { text: fmtKm(x.st.km) }), x.did + " · ",
        el("b", { text: String(x.st.count) }), x.st.count === 1 ? x.one : x.many]);
    });
    if (both || !S.length) legend.push(el("span", {}, [el("b", { text: hrs(plan.weeks.reduce(function (t, w) { return t + allSecs(w); }, 0) / weeksN) }), " a week"]));
    else legend.push(el("span", {}, [el("b", { text: fmtKm(S[0].st.km / weeksN) }), " km a week"]));
    if (others) legend.push(el("span", {}, ["+ ", el("b", { text: String(others) }), " other"]));
    app.appendChild(el("div", { class: "legend" }, legend));

    // Each week's bar: time for both sports or for neither, kilometres for one.
    var value = function (w) { return both || !S.length ? allSecs(w) : weekKm(w, S[0].key); };
    var label = function (v) { return both || !S.length ? (v ? hrs(v) : "0") : fmtKm(v); };
    var top = Math.max.apply(null, plan.weeks.map(value).concat([1]));
    app.appendChild(el("div", { class: "trend", role: "img",
      "aria-label": plan.weeks.map(function (w) { return short(w.starts) + ": " + label(value(w)) + (both || !S.length ? "" : " km"); }).join(", ") },
      plan.weeks.map(function (w) {
        var v = value(w);
        var parts = both
          ? S.map(function (x) { var t = weekSecs(w, x.key); return t ? el("i", { class: x.cls, style: "flex:" + t }) : null; })
          : [el("i", { class: S.length ? S[0].cls : "other-c", style: "flex:1" })];
        return el("div", { class: "tcol" + (w.current ? " current" : "") }, [
          el("div", { class: "tval", text: label(v) }),
          el("div", { class: "tbar-wrap" }, [
            v ? el("div", { class: "tstack", style: "height:" + Math.max(3, 100 * v / top) + "%" }, parts)
              : el("i", { class: "tbar", style: "height:3%" }),
          ]),
          el("div", { class: "tlab", text: w.current ? "This week" : short(w.starts) }),
        ]);
      })));

    S.forEach(function (x) {
      if (x.st.longest) hl.push(highlight("Longest " + x.label, x.st.longest));
      if (x.st.fastest) hl.push(highlight("Fastest " + x.label, x.st.fastest));
    });
    if (hl.length) app.appendChild(el("div", { class: "highlights" }, hl));

    app.appendChild(el("div", { class: "next" }, [
      el("div", { class: "stripe", style: "background:var(--brand)" }),
      el("div", {}, [
        el("div", { class: "next-label", text: "No plan yet" }),
        el("div", { class: "next-name", text: "Turn this into a plan" }),
        el("div", { class: "next-meta", text: "Claude builds it from these weeks and puts it on your Garmin calendar and watch." }),
        el("div", { class: "actions" }, [
          el("button", { class: "act primary", text: "Build me a plan", onclick: function (e) {
            ask("Build me a training plan from my last few weeks of " + (both ? "running and riding" : S.length && S[0].key === "ride" ? "riding" : "training") + ". Ask me my goal and event date first, then put it on my Garmin calendar.", e.currentTarget); } }),
        ]),
      ]),
    ]));

    var weeks = el("div", { class: "weeks" });
    plan.weeks.slice().reverse().forEach(function (w) {
      var isOpen = state.open["log" + w.week] != null ? state.open["log" + w.week] : !!w.current;
      var box = el("div", { class: "week" + (w.current ? " current" : "") + (isOpen ? " open" : "") });
      box.appendChild(el("button", { class: "week-head", "aria-expanded": String(isOpen), onclick: function () {
        state.open["log" + w.week] = !box.classList.contains("open"); renderLog(state.plan); } }, [
        el("div", { class: "wk" }, [weekName(w), el("small", { text: short(w.starts) })]),
        el("span", { class: "pips" }),
        el("span", { class: "count" }, [
          el("span", { class: "km", text: both || !S.length ? hrs(allSecs(w)) : fmtKm(weekKm(w, S[0].key)) + " km" }),
          el("span", { class: "sessions", text: S.map(function (x) {
            var n = w.sessions.filter(function (r) { return r.sport === x.key && r.actual_km; }).length;
            return n ? n + (n === 1 ? x.one : x.many) : null; }).filter(Boolean).join(" · ") })]),
        svg('<path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>', "chev"),
      ]));
      var list = el("div", { class: "loglist" });
      if (!w.sessions.length) list.appendChild(el("div", { class: "logrow empty-week", text: "Nothing recorded" }));
      w.sessions.forEach(function (r) {
        var k = { c: r.sport === "ride" ? "var(--ride)" : r.sport === "run" ? "var(--run)" : r.sport === "strength" ? "var(--strength)" : "var(--faint)" };
        list.appendChild(el("div", { class: "logrow", style: "--t:" + k.c }, [
          el("span", { class: "lday", text: r.day }),
          el("span", { class: "lname", text: r.name }),
          el("span", { class: "lval", text: [r.actual_km ? fmtKm(r.actual_km) + " km" : r.actual, r.pace || r.speed].filter(Boolean).join(" · ") }),
        ]));
      });
      box.appendChild(list);
      weeks.appendChild(box);
    });
    app.appendChild(weeks);
  }
  function highlight(label, r) {
    return el("div", { class: "hl" }, [
      el("div", { class: "hl-label", text: label }),
      el("div", { class: "hl-val", text: [r.actual_km ? fmtKm(r.actual_km) + " km" : null, r.pace ? r.pace.replace(" /km", "/km") : r.speed].filter(Boolean).join(" · ") }),
      el("div", { class: "hl-meta", text: r.name + " · " + long(r.date) }),
    ]);
  }

  function refresh(event) {
    var btn = event.currentTarget;
    if (!host) return;
    btn.classList.add("spin");
    request("tools/call", { name: "get_plan", arguments: state.plan ? { label: state.plan.label } : {} })
      .then(function (r) { onResult(r); })
      .catch(function () {})
      .then(function () { btn.classList.remove("spin"); });
  }

  // ---------------------------------------------------------------- start
  if (window.__PLAN_DEMO__) { render(window.__PLAN_DEMO__); D.done(); return; }
  if (!host) { D.step("no host frame"); render(null, "This view opens inside a chat that supports MCP Apps."); D.done(); return; }
  D.step("init sent");
  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "garmin-plan", version: "1.0.0" },
    clientInfo: { name: "garmin-plan", version: "1.0.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  }).then(function (result) {
    var info = (result && (result.hostInfo || result.serverInfo)) || {};
    var ctx = (result && result.hostContext) || {};
    D.initOk = true;
    D.host = [info.name, info.version, ctx.platform, ctx.theme, ctx.displayMode].filter(Boolean).join(" ") || "unnamed";
    D.step("init ok");
    applyContext(ctx);
    notify("ui/notifications/initialized", {});
    D.step("ready sent");
  }).catch(function (e) {
    D.step("init failed: " + (e && e.message));
    notify("ui/notifications/initialized", {});
  });
})();
</script>
</body>
</html>
