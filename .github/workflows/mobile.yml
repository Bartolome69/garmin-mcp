name: Mobile app

# The native app in mobile/ (docs/native-app/PLAN.md): the tokens are in step
# with the PWA's app.css and match the approved table, no colour literal sits
# outside them, the app typechecks, the tests pass on iOS and on Android, and
# Metro can bundle the app for both. No store builds (those run on EAS), and it
# never deploys; the hosted server's workflows don't watch mobile/.

on:
  pull_request:
    paths:
      - "mobile/**"
      - "garmin_mcp/app/app.css"
      - "scripts/build_tokens.py"
      - "tests/tokens_test.py"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "garmin_mcp/app/app.css"
      - "scripts/build_tokens.py"
      - "tests/tokens_test.py"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tokens in step with app.css
        run: python tests/tokens_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Colour lint, typecheck, tests (iOS and Android)
        working-directory: mobile
        run: |
          npm run lint:colours
          npm run typecheck
          npx jest --ci
      - name: Bundle for iOS and Android
        working-directory: mobile
        env:
          EXPO_OFFLINE: "1"
          CI: "1"
        run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/expo-export"
