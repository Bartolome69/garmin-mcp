name: PostHog email backfill

# One-off (Nov 14): puts each connected person's account email on their
# PostHog profile, for everyone who connected before the connector started
# doing it at sign-in. Runs scripts/posthog_backfill_emails.py on the hosted
# machine, where the store and its key are. A dry run unless "apply" is
# ticked. The log is public, so the script prints counts only.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Send the $identify calls (unticked: dry run, counts only)"
        type: boolean
        default: false

env:
  FLY_APP: garmin-mcp-1b4387

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Run on the machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: |
          remote="/tmp/posthog-backfill-$GITHUB_RUN_ID.py"
          flyctl ssh sftp shell --app "$FLY_APP" <<< "put scripts/posthog_backfill_emails.py $remote" >/dev/null
          flyctl ssh console --app "$FLY_APP" -C "python3 $remote $APPLY"
          flyctl ssh console --app "$FLY_APP" -C "rm -f $remote" || true
