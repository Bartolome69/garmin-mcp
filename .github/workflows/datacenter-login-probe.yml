name: Garmin datacenter IP probe

# Two questions, no credentials needed:
#
#   1. Does Garmin's SSO login portal accept a request from a datacenter IP?
#   2. Does the data API (connect.garmin.com) accept one?
#
# MissingMCP's own incident notes say Cloudflare guards the login portal but
# not the data API. If that holds, a hosted version only needs a clean IP for
# sign-in, not for everything — which is the difference between a $4/month VPS
# and an unworkable idea.
#
# Both probes are unauthenticated. 401 means "reached the app and was correctly
# rejected" — a PASS. 403 with a Cloudflare challenge means the address never
# got that far.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv /tmp/probe
          VIRTUAL_ENV=/tmp/probe uv pip install --only-binary :all: -r requirements.txt

      - name: Where is this runner
        run: |
          curl -s https://ipinfo.io/json | python3 -c "import json,sys; d=json.load(sys.stdin); print('egress org:', d.get('org')); print('region:', d.get('city'), d.get('country'))"

      - name: Is a 403 the edge or the application
        run: |
          /tmp/probe/bin/python - <<'PY'
          from curl_cffi import requests

          # A Cloudflare block and an ordinary "you have no token" rejection can
          # both be a 403. They are told apart by the response: an edge block
          # serves an HTML challenge page and carries cf-mitigated / cf-ray
          # headers, while the application returns JSON or an empty body.
          TARGETS = [
              ("connectapi socialProfile", "https://connectapi.garmin.com/userprofile-service/socialProfile"),
              ("connectapi daily summary", "https://connectapi.garmin.com/usersummary-service/usersummary/daily/probe"),
          ]

          for label, url in TARGETS:
              r = requests.get(url, impersonate="chrome", timeout=30)
              h = {k.lower(): v for k, v in r.headers.items()}
              body = (r.text or "").strip()
              looks_like_challenge = (
                  "text/html" in h.get("content-type", "")
                  and ("just a moment" in body.lower() or "challenge" in body.lower())
              )
              print(f"--- {label}")
              print(f"    status        {r.status_code}")
              print(f"    server        {h.get('server')}")
              print(f"    cf-mitigated  {h.get('cf-mitigated', '(none)')}")
              print(f"    content-type  {h.get('content-type')}")
              print(f"    body starts   {body[:90]!r}")
              print(f"    => {'CLOUDFLARE CHALLENGE' if looks_like_challenge else 'APPLICATION RESPONSE (no challenge served)'}")
          PY
