name: Garmin datacenter IP probe

# Answers one question: will Garmin's login endpoint talk to a server, or does
# it rate-limit datacenter addresses on sight? That decides whether a hosted
# version of this server is possible at all.
#
# Uses deliberately invalid credentials. Garmin returns 429 at the IP level
# before it ever checks a password, so "invalid credentials" is the PASS here —
# it means the address was allowed to try.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install garminconnect
        run: uv pip install --system --only-binary :all: -r requirements.txt

      - name: Where is this runner
        run: |
          curl -s https://ipinfo.io/json | python3 -c "import json,sys; d=json.load(sys.stdin); print('egress org:', d.get('org')); print('region:', d.get('city'), d.get('country'))"

      - name: Attempt one login with throwaway credentials
        run: |
          python3 - <<'PY'
          from garminconnect import Garmin

          # Not a real account. We only care which error comes back.
          client = Garmin(
              email="probe-not-a-real-account@example.invalid",
              password="not-a-real-password",
              prompt_mfa=lambda: "000000",
          )
          try:
              client.login()
              print("RESULT: unexpected success — investigate")
          except Exception as exc:
              text = str(exc).lower()
              name = type(exc).__name__
              if "429" in text or "too many" in text or "rate limit" in text:
                  print(f"RESULT: BLOCKED — Garmin rate-limits this IP ({name})")
                  print("A hosted version would fight this constantly.")
                  raise SystemExit(1)
              if "401" in text or "unauthorized" in text or "authentication failed" in text:
                  print(f"RESULT: ALLOWED — reached credential check, got the expected rejection ({name})")
                  print("A hosted version is viable from this kind of address.")
                  raise SystemExit(0)
              print(f"RESULT: INCONCLUSIVE — {name}: {exc}")
              raise SystemExit(2)
          PY
