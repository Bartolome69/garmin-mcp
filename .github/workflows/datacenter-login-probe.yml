name: Garmin datacenter IP probe

# Two questions, no credentials needed:
#
#   1. Does Garmin's SSO login portal accept a request from a datacenter IP?
#   2. Does the data API (connect.garmin.com) accept one?
#
# MissingMCP's own incident notes say Cloudflare guards the login portal but
# not the data API. If that holds, a hosted version only needs a clean IP for
# sign-in, not for everything — which is the difference between a $4/month VPS
# and an unworkable idea.
#
# Both probes are unauthenticated. 401 means "reached the app and was correctly
# rejected" — a PASS. 403 with a Cloudflare challenge means the address never
# got that far.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv /tmp/probe
          VIRTUAL_ENV=/tmp/probe uv pip install --only-binary :all: -r requirements.txt

      - name: Where is this runner
        run: |
          curl -s https://ipinfo.io/json | python3 -c "import json,sys; d=json.load(sys.stdin); print('egress org:', d.get('org')); print('region:', d.get('city'), d.get('country'))"

      - name: Probe both paths
        run: |
          /tmp/probe/bin/python - <<'PY'
          from curl_cffi import requests

          def classify(label, url):
              try:
                  # Impersonate Chrome exactly as garminconnect does, so the
                  # result reflects what the real client would see.
                  r = requests.get(url, impersonate="chrome", timeout=30)
              except Exception as exc:
                  print(f"{label}: ERROR {type(exc).__name__}: {exc}")
                  return None
              body = (r.text or "")[:200].lower()
              blocked = r.status_code in (403, 429) or "cloudflare" in body or "challenge" in body
              verdict = "BLOCKED" if blocked else "REACHED"
              print(f"{label}: HTTP {r.status_code} -> {verdict}")
              return not blocked

          print()
          sso = classify("SSO login portal  (sso.garmin.com)",
                         "https://sso.garmin.com/sso/signin?service=https%3A%2F%2Fconnect.garmin.com%2Fmodern")
          api = classify("Data API          (connect.garmin.com)",
                         "https://connect.garmin.com/userprofile-service/socialProfile")

          print()
          if api:
              print("VERDICT: the data API is reachable from this datacenter IP.")
              print("A hosted version would only need a clean IP for the sign-in step.")
          else:
              print("VERDICT: the data API is blocked here too.")
              print("A hosted version would need a clean IP for everything.")
          PY
