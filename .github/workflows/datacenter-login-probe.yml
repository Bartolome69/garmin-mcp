name: Garmin datacenter IP probe

# Two questions, no credentials needed:
#
#   1. Does Garmin's SSO login portal accept a request from a datacenter IP?
#   2. Does the data API (connect.garmin.com) accept one?
#
# MissingMCP's own incident notes say Cloudflare guards the login portal but
# not the data API. If that holds, a hosted version only needs a clean IP for
# sign-in, not for everything — which is the difference between a $4/month VPS
# and an unworkable idea.
#
# Both probes are unauthenticated. 401 means "reached the app and was correctly
# rejected" — a PASS. 403 with a Cloudflare challenge means the address never
# got that far.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv /tmp/probe
          VIRTUAL_ENV=/tmp/probe uv pip install --only-binary :all: -r requirements.txt

      - name: Where is this runner
        run: |
          curl -s https://ipinfo.io/json | python3 -c "import json,sys; d=json.load(sys.stdin); print('egress org:', d.get('org')); print('region:', d.get('city'), d.get('country'))"

      - name: Probe the API hosts
        run: |
          /tmp/probe/bin/python - <<'PY'
          from curl_cffi import requests

          # A 401 is the ideal pass: it means Garmin's application answered and
          # rejected us for having no token. A 403 or a Cloudflare challenge
          # body means the edge stopped us before the app ever saw it.
          TARGETS = [
              ("connectapi host", "https://connectapi.garmin.com/userprofile-service/socialProfile"),
              ("connect.garmin.com", "https://connect.garmin.com/userprofile-service/socialProfile"),
              ("connect modern proxy", "https://connect.garmin.com/modern/proxy/userprofile-service/socialProfile"),
              ("daily summary api", "https://connectapi.garmin.com/usersummary-service/usersummary/daily/probe"),
          ]

          reached = 0
          for label, url in TARGETS:
              try:
                  r = requests.get(url, impersonate="chrome", timeout=30)
              except Exception as exc:
                  print(f"{label:22} ERROR {type(exc).__name__}")
                  continue
              body = (r.text or "")[:300].lower()
              challenge = "cloudflare" in body or "challenge" in body or "just a moment" in body
              if r.status_code == 401 and not challenge:
                  print(f"{label:22} HTTP 401  -> REACHED THE APP (rejected for no token)")
                  reached += 1
              elif r.status_code in (403, 429) or challenge:
                  print(f"{label:22} HTTP {r.status_code}  -> BLOCKED AT THE EDGE")
              else:
                  print(f"{label:22} HTTP {r.status_code}  -> no edge block, but not a clean auth rejection")

          print()
          print(f"endpoints that returned a genuine 401: {reached}/{len(TARGETS)}")
          PY
