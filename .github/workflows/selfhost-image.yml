name: Self-host image

# Publishes the single-user, self-hosted server (Dockerfile.selfhost, see
# SELF-HOSTING.md) as ghcr.io/<owner>/garmin-mcp-selfhost, for Intel and ARM
# (Apple Silicon Macs, Raspberry Pis), so someone running it at home can pull
# an image instead of building one. Not the hosted server: that is
# ./Dockerfile, deployed to Fly by deploy-hosted.yml.
#
# A push to main that touches the server rebuilds it, but only after the
# stdio smoke test and the HTTP/OAuth test pass, so a broken main never
# replaces a working :latest. Pull requests build it without publishing.
#
# Needs nothing set up: it publishes with the workflow's own GITHUB_TOKEN. The
# first publish creates the package; if it comes out private, make it public
# under the package's settings so people can pull it without logging in.

on:
  push:
    branches: [main]
    paths:
      - "garmin_mcp/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile.selfhost"
      - "Dockerfile.selfhost.dockerignore"
      - ".github/workflows/selfhost-image.yml"
  pull_request:
    paths:
      - "garmin_mcp/**"
      - "requirements.txt"
      - "Dockerfile.selfhost"
      - "Dockerfile.selfhost.dockerignore"
      - ".github/workflows/selfhost-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same dependencies the image installs, so the tests run against
      # what ships rather than the hosted server's larger set.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r requirements.txt "mcp>=2.2,<3"

      - name: stdio smoke test
        run: python tests/smoke_test.py

      - name: HTTP and OAuth test
        run: python tests/http_test.py

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Registry paths must be lowercase; the owner's name may not be.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/garmin-mcp-selfhost" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
