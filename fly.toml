# Hosted Garmin MCP server. The local install needs none of this.
# Replace with your own app name before deploying (fly apps create <name>).
app = "garmin-mcp-CHANGE-ME"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  GARMIN_MCP_DB = "/data/garmin-mcp.sqlite3"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # Kept warm: a cold start on an MCP request looks like a broken connector.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "garmin_data"
  destination = "/data"

[[vm]]
  # 2 GB from 24 Nov: from 18 Nov the server froze for 10-40 minutes several
  # times a day until it restarted, and 1 GB with a growing database was the
  # likeliest cause. `flyctl deploy` applies this, so a resize by hand would
  # be undone by the next deploy.
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
