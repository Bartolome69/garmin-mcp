# Hosted Garmin MCP server. The local install needs none of this.
app = "garmin-mcp-1b4387"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  GARMIN_MCP_DB = "/data/garmin-mcp.sqlite3"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # Kept warm: a cold start on an MCP request looks like a broken connector.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "garmin_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
